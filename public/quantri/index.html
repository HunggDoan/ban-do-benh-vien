<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Trang quản trị bản đồ cho phòng CNTT. Sửa dữ liệu rồi lưu thẳng lên GitHub; Netlify tự đăng lại. -->
<title>Quản trị bản đồ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<style>
/* Layout: thanh trên cùng; dưới là [công cụ | bản đồ 2D để sửa | bảng thuộc tính có thẻ] */
:root{
  --bg:#eef0ed; --panel:#ffffff; --panel2:#f6f7f4; --fg:#1f2328; --muted:#5f6670; --line:#dcdfd8; --hover:#eef2ec;
  --accent:#2f6f73; --accent-fg:#ffffff; --danger:#c0392b; --warn:#a86a12; --ok:#2f7d4f;
  --m-ground:#d3dfd0; --m-road:#aaa7a2; --m-path:#f3eee6; --m-center:rgba(60,64,70,.35);
  --m-clinic:#dcc3c5; --m-emergency:#d9776f; --m-support:#d2ccc5; --m-park:#bfd0c4; --m-bstroke:rgba(40,40,40,.35);
  --m-covered:#2f8f94; --m-indoor:#7a4fb3; --m-door:#d2342a; --m-gate:#2f6f73; --m-junction:#4a5059;
  --m-sel:#1f63b0; --m-route:#e8590c; --m-bad:#c0392b; --m-label:#1f2328; --m-labelbg:rgba(255,255,255,.88);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1c1f23; --panel2:#22262b; --fg:#e9e6e3; --muted:#a3a0a5; --line:#33373d; --hover:#272b31;
  --accent:#5fb0b5; --accent-fg:#0f1a1b; --danger:#ef6b5e; --warn:#e0a548; --ok:#5cc08a;
  --m-ground:#23282b; --m-road:#3c3f44; --m-path:#3a3f45; --m-center:rgba(220,220,220,.25);
  --m-clinic:#7d6467; --m-emergency:#b0524b; --m-support:#5f5b58; --m-park:#4f6656; --m-bstroke:rgba(255,255,255,.25);
  --m-covered:#5fb0b5; --m-indoor:#b08ae0; --m-door:#ff6a5c; --m-gate:#5fb0b5; --m-junction:#c9c5c2;
  --m-sel:#6eaeff; --m-route:#ff8a3d; --m-bad:#ff6a5c; --m-label:#ece8e6; --m-labelbg:rgba(28,31,35,.88); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1c1f23; --panel2:#22262b; --fg:#e9e6e3; --muted:#a3a0a5; --line:#33373d; --hover:#272b31;
  --accent:#5fb0b5; --accent-fg:#0f1a1b; --danger:#ef6b5e; --warn:#e0a548; --ok:#5cc08a;
  --m-ground:#23282b; --m-road:#3c3f44; --m-path:#3a3f45; --m-center:rgba(220,220,220,.25);
  --m-clinic:#7d6467; --m-emergency:#b0524b; --m-support:#5f5b58; --m-park:#4f6656; --m-bstroke:rgba(255,255,255,.25);
  --m-covered:#5fb0b5; --m-indoor:#b08ae0; --m-door:#ff6a5c; --m-gate:#5fb0b5; --m-junction:#c9c5c2;
  --m-sel:#6eaeff; --m-route:#ff8a3d; --m-bad:#ff6a5c; --m-label:#ece8e6; --m-labelbg:rgba(28,31,35,.88); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12.5px}
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}
#app > header{grid-row:1}#banner{grid-row:2}#app > main{grid-row:3}

/* thanh trên */
header.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
#status{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.dirty{color:var(--warn)}.pill.bad{color:var(--danger);cursor:pointer}.pill.warn{color:var(--warn);cursor:pointer}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn,.acts button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;text-decoration:none;color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover,.acts button:hover{background:var(--hover)}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-fg)!important;font-weight:600!important}
.danger{color:var(--danger)!important;border-color:color-mix(in srgb,var(--danger) 40%,var(--line))!important}
button:disabled{opacity:.5;cursor:not-allowed}
#banner{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#banner span{margin-right:auto;line-height:1.45}

main{display:grid;grid-template-columns:52px minmax(0,1fr) clamp(380px,32vw,500px);min-height:0}
.tools{display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.tools button{width:40px;height:40px;display:grid;place-items:center;border:1px solid transparent;border-radius:9px;background:none;position:relative}
.tools button:hover{background:var(--hover)}
.tools button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.tools kbd{position:absolute;right:2px;bottom:1px;font-size:9px;font-family:var(--mono);color:var(--muted)}
.tools hr{width:28px;border:none;border-top:1px solid var(--line);margin:4px auto}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{display:block;touch-action:none}
#hint{position:absolute;left:12px;top:12px;right:12px;max-width:600px;font-size:12.5px;line-height:1.45;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08);pointer-events:none}
#hint b{color:var(--accent)}
#coord{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
#legend{position:absolute;right:12px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{display:inline-block;width:14px;height:4px;border-radius:2px}

/* bảng bên phải */
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;justify-content:center;border:none;background:none;padding:11px 8px 9px;font-size:12.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff}
.tabs .cnt.w{background:var(--warn)}
#tabBody{overflow:auto;padding:14px 16px 28px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
p{margin:0;line-height:1.55}
.muted{color:var(--muted)}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.tag.door{color:var(--m-door)}.tag.gate{color:var(--m-gate)}.tag.junction{color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{font-size:12px;font-weight:600;color:var(--muted)}
.f small{font-size:12px;color:var(--muted);line-height:1.45}
.f input:not([type=checkbox]),.f select,.f textarea,.tbl input,.tbl select,.inl input,.inl select{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 8px;font-size:13.5px}
.f textarea{resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.4;cursor:pointer}
.chk input{margin-top:2px}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.bar.sec{flex-direction:row}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.bar button,.bar a{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--fg);text-decoration:none}
.bar button:hover,.bar a:hover{background:var(--hover)}
.links{display:flex;flex-direction:column;gap:2px}
.links button{text-align:left;border:none;background:none;border-radius:6px;padding:6px 8px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.links button:hover{background:var(--hover)}
.links .sub{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 4px 3px 10px}
.chip button{border:none;background:none;width:20px;height:20px;border-radius:50%;line-height:1;color:var(--muted)}
.chip button:hover{background:var(--hover);color:var(--danger)}
.inl{display:flex;gap:6px;align-items:center}
.inl > *{min-width:0}
.inl > select,.inl > input{flex:1;width:auto!important}
.inl > button,.inl > .btn{flex:none}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:6px 6px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.act{white-space:nowrap;width:1%}
.tbl td.act button{border:none;background:none;width:24px;height:26px;border-radius:5px;color:var(--muted)}
.tbl td.act button:hover{background:var(--hover);color:var(--fg)}
.tbl td.act button.x:hover{color:var(--danger)}
.tbl input{padding:4px 6px!important;font-size:13px!important}
.tbl tr.floorbreak td{border-top:2px solid var(--line)}
.msg{font-size:13px;line-height:1.5;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.msg.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.msg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.msg.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.issues{display:flex;flex-direction:column;gap:4px}
.issues button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px;font-size:13px;line-height:1.45;display:grid;grid-template-columns:14px 1fr;gap:8px}
.issues button:hover{background:var(--hover)}
.issues i{width:8px;height:8px;border-radius:50%;margin-top:6px}
.issues .e i{background:var(--danger)}.issues .w i{background:var(--warn)}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--line)}
ol.steps li span:first-child{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
details > summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"＋";color:var(--muted)}
details[open] > summary::after{content:"－"}
details > div{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.kb{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kb kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel2);justify-self:start}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .it{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.hist .it .m{font-size:13.5px;font-weight:500;line-height:1.4}
.hist .it .s{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13.5px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;width:min(560px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow:auto}
.dlg h2{margin:0;font-size:18px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg-acts button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:500}
.sum{margin:0;padding-left:18px;line-height:1.6;font-size:13.5px}
#fatal{padding:32px;max-width:640px;line-height:1.6}

@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{grid-template-columns:48px minmax(0,1fr);grid-template-rows:62vh auto}
  .panel{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}
  #tabBody{overflow:visible}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><b>Quản trị bản đồ bệnh viện</b><span id="srcInfo">Đang tải dữ liệu…</span></div>
    <div id="status" aria-live="polite"></div>
    <div class="acts">
      <button id="bUndo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">↶ Hoàn tác</button>
      <button id="bRedo" title="Làm lại (Ctrl+Y)" aria-label="Làm lại">↷</button>
      <a id="bPreview" class="btn" href="../?preview=1" target="_blank" rel="noopener">Xem thử trang người bệnh</a>
      <button id="bExport">Tải file</button>
      <label class="btn" for="fImport">Mở file</label>
      <input type="file" id="fImport" accept=".json,application/json" hidden>
      <button id="bSettings">Cài đặt GitHub</button>
      <button id="bSave" class="primary" title="Lưu (Ctrl+S)">Lưu lên GitHub</button>
    </div>
  </header>
  <div id="banner" hidden></div>
  <main>
    <nav class="tools" aria-label="Công cụ vẽ" id="tools"></nav>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="Bản đồ để chỉnh sửa"></canvas>
      <div id="hint"></div>
      <div id="coord">—</div>
      <div id="legend">
        <span><i style="background:var(--m-path);outline:1px solid var(--m-center)"></i>Lối đi</span>
        <span><i style="background:var(--m-covered)"></i>Mái che</span>
        <span><i style="background:repeating-linear-gradient(90deg,var(--m-indoor) 0 5px,transparent 5px 8px)"></i>Trong nhà</span>
        <span><i style="background:var(--m-door);width:8px;height:8px;border-radius:50%"></i>Cửa</span>
        <span><i style="background:var(--m-gate);width:8px;height:8px"></i>Cổng</span>
        <span><i style="border:1.5px solid var(--m-junction);width:7px;height:7px;border-radius:50%;background:none"></i>Ngã rẽ</span>
      </div>
    </section>
    <aside class="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tabBody" role="tabpanel"></div>
    </aside>
  </main>
</div>

<dialog id="dlgSave"><div class="dlg">
  <h2>Lưu lên GitHub</h2>
  <div id="saveSummary"></div>
  <label class="f"><span class="fl">Mô tả thay đổi</span><textarea id="saveMsg" rows="3"></textarea><small>Dòng này hiện trong lịch sử, giúp người khác biết bạn đã sửa gì.</small></label>
  <label class="f"><span class="fl">Người sửa</span><input id="saveWho" placeholder="ví dụ: Hưng – CNTT"></label>
  <div id="saveOut" hidden></div>
  <div class="dlg-acts" id="saveActs">
    <button id="saveCancel">Đóng</button>
    <button id="saveGo" class="primary">Lưu</button>
  </div>
</div></dialog>

<dialog id="dlgSettings"><div class="dlg">
  <h2>Cài đặt GitHub</h2>
  <p class="muted">Thông tin này chỉ lưu trên trình duyệt của máy này. Mỗi người vận hành dùng mã truy cập (token) của riêng mình.</p>
  <div class="row2">
    <label class="f"><span class="fl">Tài khoản hoặc tổ chức</span><input id="gOwner" placeholder="ví dụ: benhviensannhi"></label>
    <label class="f"><span class="fl">Tên kho (repository)</span><input id="gRepo" placeholder="ví dụ: ban-do-benh-vien"></label>
  </div>
  <div class="row2">
    <label class="f"><span class="fl">Nhánh</span><input id="gBranch" placeholder="main"></label>
    <label class="f"><span class="fl">Đường dẫn file dữ liệu</span><input id="gPath" class="mono" placeholder="public/map_data.json"></label>
  </div>
  <label class="f"><span class="fl">Mã truy cập (fine-grained token)</span><input id="gToken" type="password" class="mono" autocomplete="off" placeholder="github_pat_…"><small>Tạo trong GitHub → Settings → Developer settings → Fine-grained tokens. Chỉ chọn kho này, quyền <b>Contents: Read and write</b>.</small></label>
  <label class="f"><span class="fl">Tên người sửa (ghi vào lịch sử)</span><input id="gWho" placeholder="ví dụ: Hưng – CNTT"></label>
  <div id="gOut" hidden></div>
  <div class="dlg-acts">
    <button id="gForget" class="danger">Xóa token khỏi máy này</button>
    <button id="gTest">Kiểm tra kết nối</button>
    <button id="gCancel">Đóng</button>
    <button id="gSave" class="primary">Lưu cài đặt</button>
  </div>
</div></dialog>

<div id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
// =====================================================================
// TIỆN ÍCH
// =====================================================================
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="html")el.innerHTML=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,"");else el.setAttribute(k,v);}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;el.append(c.nodeType?c:document.createTextNode(String(c)));});
  return el;
}
function inp(value,onCommit,o={}){
  const el=h("input",{type:o.type||"text",id:o.id,placeholder:o.ph,step:o.step,class:o.cls,"aria-label":o.aria,list:o.list});
  el.value=value??"";
  el.addEventListener("change",()=>{const raw=el.value.trim();onCommit(o.type==="number"?(raw===""?null:Number(raw)):raw,el);});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&el.tagName==="INPUT")el.blur();});

}
function txa(value,onCommit,o={}){const el=h("textarea",{id:o.id,rows:o.rows||2,placeholder:o.ph,class:o.cls});el.value=value??"";el.addEventListener("change",()=>onCommit(el.value.trim(),el));return el;}
function pick(options,value,onCommit,o={}){
  const el=h("select",{id:o.id,"aria-label":o.aria});
  options.forEach(opt=>{
    if(opt.group){const g=h("optgroup",{label:opt.group});opt.items.forEach(([v,l])=>{const op=h("option",{value:v},l);if(String(v)===String(value??""))op.selected=true;g.append(op);});el.append(g);}
    else{const [v,l]=opt;const op=h("option",{value:v},l);if(String(v)===String(value??""))op.selected=true;el.append(op);}
  });
  el.addEventListener("change",()=>onCommit(el.value,el));return el;
}

function b64enc(str){const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function b64dec(b64){const bin=atob(b64.replace(/\s/g,""));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}

function segOf(a,b,e){const s={a,b};if(e&&e.width)s.width=+e.width;if(e&&e.covered)s.covered=true;if(e&&e.canopy===false)s.canopy=false;if(e&&e.indoor)s.indoor=e.indoor;return s;}
function toInternal(j){
  const d=JSON.parse(JSON.stringify(j||{}));
  d.config=d.config||{};d.nodes=d.nodes||[];d.places=d.places||[];d.buildings=d.buildings||[];d.gates=d.gates||[];
  d.gateFacing=d.gateFacing||{};d.oldIds=d.oldIds||{};d.quickSearches=d.quickSearches||[];d.decor=d.decor||{};d.decor.labels=d.decor.labels||[];
  d.segs=[];(d.edges||[]).forEach(e=>{const p=e.path||[e.a,e.b];for(let i=0;i<p.length-1;i++)d.segs.push(segOf(p[i],p[i+1],e));});
  delete d.edges;
  d.places.forEach(p=>{p.doors=p.doors||[];p.departments=p.departments||[];});
  d.buildings.forEach(b=>{b.rect=(b.rect||[0,0,10,10]).map(Number);});
  return d;
}
const segKey=s=>JSON.stringify([s.width||null,!!s.covered,s.canopy===false,s.indoor||null]);
function compressSegs(segs){
  // Gộp các đoạn liền nhau có cùng thuộc tính thành một chuỗi "path" cho file gọn, dễ đọc
  const groups=new Map();segs.forEach((s,i)=>{const k=segKey(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);});
  const out=[];
  groups.forEach(idxs=>{
    const adj=new Map(),add=(n,i)=>{if(!adj.has(n))adj.set(n,[]);adj.get(n).push(i);};
    idxs.forEach(i=>{add(segs[i].a,i);add(segs[i].b,i);});
    const used=new Set(),deg=n=>adj.get(n).length;
    const walk=start=>{const path=[start];let cur=start,first=Infinity;
      for(;;){const nx=adj.get(cur).find(i=>!used.has(i));if(nx==null)break;used.add(nx);first=Math.min(first,nx);const s=segs[nx];cur=s.a===cur?s.b:s.a;path.push(cur);if(deg(cur)!==2)break;}
      return {path,first};};
    const order=[];idxs.forEach(i=>order.push(segs[i].a,segs[i].b));
    const run=(onlyEnds)=>order.forEach(n=>{if(onlyEnds&&deg(n)===2)return;while(adj.get(n).some(i=>!used.has(i))){const w=walk(n);if(w.path.length>1)out.push(w);}});
    run(true);run(false);
    const rep=segs[idxs[0]];
    out.forEach(w=>{if(!w.attrs)w.attrs=rep;});
  });
  out.sort((a,b)=>a.first-b.first);
  return out.map(w=>{const e={path:w.path};const r=w.attrs;if(r.width)e.width=r.width;if(r.covered)e.covered=true;if(r.canopy===false)e.canopy=false;if(r.indoor)e.indoor=r.indoor;return e;});
}
function cleanNode(n){
  const o={id:n.id,type:n.type,x:Math.round(+n.x),y:Math.round(+n.y)};
  if(n.type==="junction")o.landmark=n.landmark||n.name||"";else o.name=n.name||n.landmark||"";
  Object.keys(n).forEach(k=>{if(!(k in o)&&k!=="name"&&k!=="landmark")o[k]=n[k];});
  return o;
}
function cleanPlace(p){
  const q={id:p.id,name:p.name};if(p.building)q.building=p.building;q.doors=p.doors.slice();
  if(p.departments.length)q.departments=p.departments.map(x=>{const y={floor:(x.floor===""||x.floor==null||isNaN(+x.floor))?null:+x.floor,name:x.name||""};if(x.keywords)y.keywords=x.keywords;return y;});
  if(p.keywords)q.keywords=p.keywords;if(p.note)q.note=p.note;
  Object.keys(p).forEach(k=>{if(!(k in q)&&!["building","departments","keywords","note"].includes(k))q[k]=p[k];});
  return q;
}
function cleanBuilding(b){
  const o={id:b.id,label:b.label||"",rect:b.rect.map(v=>Math.round(+v)),floors:Math.max(1,Math.round(+b.floors||1)),kind:b.kind||"support"};
  if(b.place)o.place=b.place;if(b.info)o.info=b.info;
  Object.keys(b).forEach(k=>{if(!(k in o)&&!["place","info"].includes(k))o[k]=b[k];});
  return o;
}
function toExternal(d){
  const src=Object.assign({},d);delete src.segs;
  src.edges=compressSegs(d.segs);src.nodes=d.nodes.map(cleanNode);src.places=d.places.map(cleanPlace);src.buildings=d.buildings.map(cleanBuilding);
  const o={};KEY_ORDER.forEach(k=>{if(k in src)o[k]=src[k];});Object.keys(src).forEach(k=>{if(!(k in o))o[k]=src[k];});
  return o;
}
function serialize(o){
  // Mỗi phần tử một dòng, để lịch sử GitHub hiện rõ dòng nào thay đổi
  const L=["{"],ks=Object.keys(o);
  ks.forEach((k,i)=>{const v=o[k],c=i<ks.length-1?",":"";
    if(Array.isArray(v)&&v.length&&v[0]&&typeof v[0]==="object"&&!Array.isArray(v[0])){L.push(`  ${JSON.stringify(k)}: [`);v.forEach((x,j)=>L.push("    "+JSON.stringify(x)+(j<v.length-1?",":"")));L.push("  ]"+c);}
    else if(k==="decor"&&v&&typeof v==="object"){const dk=Object.keys(v);L.push(`  "decor": {`);
      dk.forEach((d,j)=>{const w=v[d],cc=j<dk.length-1?",":"";
        if(Array.isArray(w)&&w.length&&w[0]&&typeof w[0]==="object"&&!Array.isArray(w[0])){L.push(`    ${JSON.stringify(d)}: [`);w.forEach((x,m)=>L.push("      "+JSON.stringify(x)+(m<w.length-1?",":"")));L.push("    ]"+cc);}
        else L.push(`    ${JSON.stringify(d)}: ${JSON.stringify(w)}${cc}`);});
      L.push("  }"+c);}
    else L.push(`  ${JSON.stringify(k)}: ${JSON.stringify(v)}${c}`);});
  L.push("}");return L.join("\n")+"\n";
}
const normalizeText=text=>serialize(toExternal(toInternal(JSON.parse(text))));

let D=null,NM=new Map(),BM=new Map(),PM=new Map();
let baseInternal=null,baseNorm="",baseSha=null,baseSrc="";

let SEL=null;           // {k:"node",id} | {k:"seg",i} | {k:"bld",id} | {k:"gate",i}
let tool="select",connectFrom=null,pickDoorFor=null,showIds=false;

function reindex(){NM=new Map(D.nodes.map(n=>[n.id,n]));BM=new Map(D.buildings.map(b=>[b.id,b]));PM=new Map(D.places.map(p=>[p.id,p]));}
const current=()=>serialize(toExternal(D));

function newId(prefix,exists){let i=1;while(exists(`${prefix}_${i}`))i++;return `${prefix}_${i}`;}

function mutate(label,fn,opt={}){
  const snap=JSON.stringify(D);
  const r=fn();
  if(r===false)return false;
  undoStack.push({snap,label});if(undoStack.length>200)undoStack.shift();redoStack=[];
  afterChange(opt);return true;
}
function afterChange(opt={}){
  reindex();fixSel();validateAll();if(RT&&RT.start)runRoute(true);saveDraft();render();updateStatus();
  if(opt.keepPanel)refreshTabs();else refreshPanel();
}
function undo(){if(!undoStack.length){toast("Không còn gì để hoàn tác.");return;}const u=undoStack.pop();redoStack.push({snap:JSON.stringify(D),label:u.label});D=JSON.parse(u.snap);afterChange();toast("Đã hoàn tác: "+u.label);}
function redo(){if(!redoStack.length){toast("Không còn gì để làm lại.");return;}const u=redoStack.pop();undoStack.push({snap:JSON.stringify(D),label:u.label});D=JSON.parse(u.snap);afterChange();toast("Đã làm lại: "+u.label);}
function fixSel(){
  if(!SEL)return;
  if(SEL.k==="node"&&!NM.has(SEL.id))SEL=null;
  else if(SEL.k==="bld"&&!BM.has(SEL.id))SEL=null;
  else if(SEL.k==="seg"&&!D.segs[SEL.i])SEL=null;
  else if(SEL.k==="gate"&&!D.gates[SEL.i])SEL=null;
  if(connectFrom&&!NM.has(connectFrom))connectFrom=null;
  if(curPlace&&!PM.has(curPlace))curPlace=null;
}

function validateAll(){
  const E=[],W=[],bad=new Set();
  const err=(m,ref)=>{E.push({m,ref});if(ref&&ref.k==="node")bad.add(ref.id);};
  const warn=(m,ref)=>W.push({m,ref});
  const seen=new Set();
  D.nodes.forEach(n=>{
    const r={k:"node",id:n.id};
    if(!NODE_ID_RE.test(n.id))err(`Mã điểm "${n.id}" chỉ được dùng chữ thường không dấu, số và dấu gạch dưới.`,r);
    if(seen.has(n.id))err(`Mã điểm "${n.id}" bị trùng.`,r);seen.add(n.id);
    if(!["gate","door","junction"].includes(n.type))err(`Điểm "${n.id}" có loại không hợp lệ.`,r);
    if(!isFinite(+n.x)||!isFinite(+n.y))err(`Điểm "${n.id}" thiếu tọa độ.`,r);
    if(n.type!=="junction"&&!n.name)err(`${TYPE_LABEL[n.type]} "${n.id}" chưa có tên hiển thị.`,r);
    if(n.type==="junction"&&!n.landmark)warn(`Ngã rẽ "${n.id}" chưa có tên mốc. Câu chỉ dẫn sẽ đọc mã điểm thay cho tên.`,r);
  });
  const deg=new Map(),pairs=new Set();
  D.segs.forEach((s,i)=>{
    const r={k:"seg",i};
    if(!NM.has(s.a)||!NM.has(s.b)){err(`Đoạn đường thứ ${i+1} nối tới điểm không tồn tại ("${!NM.has(s.a)?s.a:s.b}").`,r);return;}
    if(s.a===s.b){err(`Đoạn đường thứ ${i+1} nối một điểm với chính nó.`,r);return;}
    const k=[s.a,s.b].sort().join("|");if(pairs.has(k))warn(`Có 2 đoạn đường trùng nhau giữa "${nodeLabel(s.a)}" và "${nodeLabel(s.b)}".`,r);pairs.add(k);
    deg.set(s.a,(deg.get(s.a)||0)+1);deg.set(s.b,(deg.get(s.b)||0)+1);
    if(s.indoor===""||(s.indoor!=null&&!String(s.indoor).trim()))warn(`Đoạn đi trong nhà giữa "${nodeLabel(s.a)}" và "${nodeLabel(s.b)}" chưa ghi tên chỗ đi qua.`,r);
  });
  const root=NM.has("cong_chinh")?"cong_chinh":(D.nodes.find(n=>n.type==="gate")||D.nodes[0]||{}).id;
  if(!NM.has("cong_chinh"))warn(`Không có điểm "cong_chinh". Link không có tham số start sẽ không biết đặt người dùng ở đâu.`,null);
  if(root){
    const G=derive(),res=dijkstra(G,root);
    D.nodes.forEach(n=>{
      if(isFinite(res.dist[n.id]))return;
      const r={k:"node",id:n.id};
      if(n.type==="junction"){if(!deg.get(n.id))warn(`Ngã rẽ "${n.id}" chưa nối với đường nào.`,r);else warn(`Ngã rẽ "${n.id}" không thông tới ${nodeLabel(root)}.`,r);}
      else err(`${TYPE_LABEL[n.type]} "${nodeLabel(n.id)}" chưa có đường đi tới ${nodeLabel(root)}.`,r);
    });
  }
  D.nodes.forEach(n=>{if(n.type==="junction"&&deg.get(n.id)===1)warn(`Ngã rẽ "${nodeLabel(n.id)}" là đường cụt (chỉ nối 1 đoạn).`,{k:"node",id:n.id});});
  const pseen=new Set(),doorUsed=new Set();
  D.places.forEach(p=>{
    const r={k:"place",id:p.id};
    if(!PLACE_ID_RE.test(p.id))err(`Mã điểm đến "${p.id}" chỉ được dùng chữ, số và dấu gạch dưới.`,r);
    if(pseen.has(p.id))err(`Mã điểm đến "${p.id}" bị trùng.`,r);pseen.add(p.id);
    if(!p.name)err(`Điểm đến "${p.id}" chưa có tên.`,r);
    if(!p.doors.length)err(`Điểm đến "${p.name||p.id}" chưa có cửa nào, nên không chỉ đường tới được.`,r);
    p.doors.forEach(d=>{if(!NM.has(d))err(`Điểm đến "${p.name}" dùng cửa "${d}" không tồn tại.`,r);else doorUsed.add(d);});
    if(p.building&&!BM.has(p.building))err(`Điểm đến "${p.name}" gắn với khối nhà "${p.building}" không tồn tại.`,r);
    p.departments.forEach((x,i)=>{
      if(!x.name)err(`Điểm đến "${p.name}": khoa thứ ${i+1} chưa có tên.`,r);
      if(x.floor!=null&&x.floor!==""&&(!Number.isInteger(+x.floor)||+x.floor<-5||+x.floor>60))err(`Điểm đến "${p.name}": tầng của "${x.name}" không hợp lệ.`,r);
    });
  });
  D.nodes.forEach(n=>{if(n.type==="door"&&!doorUsed.has(n.id))warn(`Cửa "${nodeLabel(n.id)}" chưa thuộc điểm đến nào. Người bệnh vẫn chọn được làm điểm xuất phát nhưng không tìm tới được.`,{k:"node",id:n.id});});
  const bseen=new Set();
  D.buildings.forEach(b=>{
    const r={k:"bld",id:b.id};
    if(!b.id)err("Có khối nhà chưa có mã.",r);
    if(bseen.has(b.id))err(`Mã khối nhà "${b.id}" bị trùng.`,r);bseen.add(b.id);
    const [x1,y1,x2,y2]=b.rect;if(!(x2>x1&&y2>y1))err(`Khung của khối nhà "${b.label||b.id}" không hợp lệ (góc phải phải lớn hơn góc trái).`,r);
    if(!(+b.floors>=1))err(`Khối nhà "${b.label||b.id}" phải có ít nhất 1 tầng.`,r);
    if(b.place&&!PM.has(b.place))err(`Khối nhà "${b.label||b.id}" gắn với điểm đến "${b.place}" không tồn tại.`,r);
  });
  D.gates.forEach((g,i)=>{if(!PM.has(g.place))err(`Khung cổng thứ ${i+1} gắn với điểm đến "${g.place}" không tồn tại.`,{k:"gate",i});});
  Object.keys(D.gateFacing).forEach(k=>{if(!NM.has(k))warn(`Hướng nhìn mặc định được đặt cho điểm "${k}" không tồn tại.`,{k:"other"});});
  Object.entries(D.oldIds).forEach(([k,v])=>{
    if(NM.has(k))warn(`Mã cũ "${k}" trùng với một điểm đang dùng, nên dòng mã cũ này không có tác dụng.`,{k:"other"});
    if(v&&!NM.has(v))err(`Mã cũ "${k}" chuyển sang "${v}" nhưng điểm "${v}" không tồn tại.`,{k:"other"});
  });
  const hay=[];D.places.forEach(p=>{hay.push(norm(p.name+" "+(p.keywords||"")));p.departments.forEach(x=>hay.push(norm(x.name+" "+p.name+" "+(x.keywords||""))));});
  D.quickSearches.forEach(q=>{
    if(!q.label)err("Có nút tìm nhanh chưa có nhãn.",{k:"other"});
    const t=norm(q.query).split(" ").filter(Boolean);if(!t.length||!hay.some(x=>t.every(w=>x.includes(w))))warn(`Nút tìm nhanh "${q.label}" không ra kết quả nào.`,{k:"other"});
  });
  ["metersPerPixel","walkingSpeed","mapUpBearing"].forEach(k=>{if(!isFinite(+D.config[k]))err(`Cấu hình "${k}" chưa có giá trị số.`,{k:"other"});});
  if(!D.config.domain)err("Cấu hình chưa có tên miền trang web.",{k:"other"});
  V={errors:E,warnings:W,bad};
}

function derive(){
  const N={};D.nodes.forEach(n=>N[n.id]={id:n.id,x:+n.x,y:+n.y,type:n.type==="junction"?"jct":n.type,name:n.name||n.landmark||n.id,lm:n.landmark||n.name||n.id});

const fmtM=m=>Math.max(5,Math.round(m/5)*5)+" m";
function buildSteps(G,route,dept,facing){
  const mpp=+D.config.metersPerPixel||.085,meters=px=>px*mpp,N=G.N,ids=route.ids,steps=[];
  const total=route.edges.reduce((s,e)=>s+meters(e.len),0);
  steps.push(`Bạn đang ở <b>${esc(N[ids[0]].name)}</b>`);
  if(route.edges.length&&facing!=null){
    const a=N[ids[0]],b=N[ids[1]],tgt=esc(b.type==="jct"?b.lm:b.name);
    let d=Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI-facing;while(d<=-180)d+=360;while(d>180)d-=360;
    if(Math.abs(d)>145)steps.push(`<b>Quay lưng lại tấm biển QR</b>, hướng về ${tgt}`);
    else if(d>=35)steps.push(`<b>Quay người sang phải</b>, hướng về ${tgt}`);
    else if(d<=-35)steps.push(`<b>Quay người sang trái</b>, hướng về ${tgt}`);
    else steps.push(`<b>Đi thẳng về phía trước</b>, hướng về ${tgt}`);
  }
  if(!route.edges.length)steps.push(`Bạn đang đứng ngay <b>${esc(N[ids[0]].name)}</b>`);

    if(+dept.floor===1)steps.push(`<b>${esc(dept.name)}</b> ở ngay <b>Tầng 1</b>, vào cửa là tới`);
    else if(dept.floor!=null&&dept.floor!=="")steps.push(`Vào tòa, lên <b>Tầng ${esc(dept.floor)}</b> bằng thang máy hoặc cầu thang bộ để tới <b>${esc(dept.name)}</b>`);
    else steps.push(`Vào tòa, hỏi quầy hướng dẫn để tới <b>${esc(dept.name)}</b>`);

}
function defaultFacing(id){

function runRoute(silent){

  const G=derive();if(!G.N[RT.start]){RT.ids=null;RT.msg="Điểm xuất phát không còn tồn tại.";return;}
  let place,dept=null;

function projOnSeg(i,mx,my){const sg=D.segs[i],a=NM.get(sg.a),b=NM.get(sg.b);const r=distSeg(mx,my,+a.x,+a.y,+b.x,+b.y),t=Math.max(.04,Math.min(.96,r.t));return [Math.round(+a.x+(b.x-a.x)*t),Math.round(+a.y+(b.y-a.y)*t)];}
function splitSeg(i,id){const sg=D.segs[i],s2=Object.assign({},sg,{a:id,b:sg.b});sg.b=id;D.segs.splice(i+1,0,s2);}
function createNode(type,mx,my,h,alt){
  const pre=type==="door"?"cua_moi":type==="gate"?"cong_moi":"nga_re",id=newId(pre,k=>NM.has(k)||D.nodes.some(n=>n.id===k));
  let x,y;if(h&&h.k==="seg")[x,y]=projOnSeg(h.i,mx,my);else[x,y]=snapPt(mx,my,null,alt);
  const n={id,type,x,y};if(type==="junction")n.landmark="";else n.name=type==="door"?"Cửa mới":"Cổng mới";
  D.nodes.push(n);NM.set(id,n);if(h&&h.k==="seg")splitSeg(h.i,id);return id;
}

const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
cv.addEventListener("contextmenu",e=>{e.preventDefault();if(connectFrom){connectFrom=null;render();updateHint();}});
cv.addEventListener("pointerdown",e=>{
  if(!D)return;cv.setPointerCapture(e.pointerId);
  const [sx,sy]=pt(e),[mx,my]=toM(sx,sy);
  if(e.button===2)return;
  if(e.button===1||spaceDown){drag={type:"pan",sx,sy,ox:view.ox,oy:view.oy};return;}
  const h=hitTest(sx,sy);
  if(pickDoorFor){if(h&&h.k==="node"){addDoorToPlace(pickDoorFor,h.id);}else toast("Bấm đúng vào một cửa hoặc cổng.");return;}
  if(tool==="select"){
    if(h&&h.k==="handle"){drag={type:"handle",id:h.id,h:h.h,snap:JSON.stringify(D),moved:false,sx,sy};}
    else if(h&&h.k==="node"){select({k:"node",id:h.id});drag={type:"node",id:h.id,snap:JSON.stringify(D),moved:false,sx,sy};}
    else if(h&&h.k==="bld"){select({k:"bld",id:h.id});drag={type:"bld",id:h.id,snap:JSON.stringify(D),moved:false,sx,sy,mx,my,r0:BM.get(h.id).rect.slice()};}
    else if(h&&(h.k==="seg"||h.k==="gate")){select(h);drag={type:"pan",sx,sy,ox:view.ox,oy:view.oy};}
    else drag={type:"pan",sx,sy,ox:view.ox,oy:view.oy,empty:true};
  }else if(tool==="door"||tool==="junction"||tool==="gate"){
    if(h&&h.k==="node"){select({k:"node",id:h.id});return;}
    let id;mutate(tool==="door"?"Thêm cửa":tool==="gate"?"Thêm cổng":"Thêm ngã rẽ",()=>{id=createNode(tool,mx,my,h,e.altKey);});
    select({k:"node",id});
  }else if(tool==="connect"){connectClick(mx,my,h,e.altKey);}
  else if(tool==="building"){const x=Math.round(mx),y=Math.round(my);drag={type:"rect",x0:x,y0:y,x1:x,y1:y};}
  else if(tool==="delete"){if(h&&h.k!=="handle")deleteObj(h);}
});
cv.addEventListener("pointermove",e=>{
  if(!D)return;const [sx,sy]=pt(e),[mx,my]=toM(sx,sy);mouseM={sx:mx,sy:my};
  $("#coord").textContent=`x ${Math.round(mx)} · y ${Math.round(my)} · ${Math.round(view.s*100)}%`;
  if(drag){
    if(drag.type==="pan"){view.ox=drag.ox+(sx-drag.sx);view.oy=drag.oy+(sy-drag.sy);if(Math.hypot(sx-drag.sx,sy-drag.sy)>3)drag.moved=true;render();return;}
    if(!drag.moved&&Math.hypot(sx-(drag.sx||sx),sy-(drag.sy||sy))<3&&drag.type!=="rect")return;
    drag.moved=true;
    if(drag.type==="node"){const n=NM.get(drag.id),[x,y]=snapPt(mx,my,drag.id,e.altKey);n.x=x;n.y=y;}
    else if(drag.type==="bld"){const b=BM.get(drag.id),dx=Math.round(mx-drag.mx),dy=Math.round(my-drag.my);b.rect=[drag.r0[0]+dx,drag.r0[1]+dy,drag.r0[2]+dx,drag.r0[3]+dy];}
    else if(drag.type==="handle"){const b=BM.get(drag.id),x=Math.round(mx),y=Math.round(my);if(drag.h.includes("w"))b.rect[0]=x;if(drag.h.includes("e"))b.rect[2]=x;if(drag.h.includes("n"))b.rect[1]=y;if(drag.h.includes("s"))b.rect[3]=y;}
    else if(drag.type==="rect"){drag.x1=Math.round(mx);drag.y1=Math.round(my);}
    render();return;
  }
  const h=pickDoorFor||tool!=="building"?hitTest(sx,sy):null;
  if(tool==="connect"&&connectFrom&&!(h&&h.k==="node"))snapPt(mx,my,null,e.altKey);else if(tool==="door"||tool==="junction"||tool==="gate"){if(!(h&&(h.k==="node"||h.k==="seg")))snapPt(mx,my,null,e.altKey);else guides=null;}else guides=null;
  hover=h;
  cv.style.cursor=spaceDown?"grab":h&&h.k==="handle"?(h.h==="nw"||h.h==="se"?"nwse-resize":"nesw-resize"):tool==="select"?(h&&(h.k==="node"||h.k==="bld")?"move":h?"pointer":"grab"):tool==="delete"?(h?"pointer":"default"):"crosshair";
  render();
});
cv.addEventListener("pointerup",()=>{
  if(!drag)return;const d=drag;drag=null;guides=null;
  if((d.type==="node"||d.type==="bld"||d.type==="handle")&&d.moved){
    if(d.type==="handle"){const b=BM.get(d.id),[x1,y1,x2,y2]=b.rect;b.rect=[Math.min(x1,x2),Math.min(y1,y2),Math.max(x1,x2),Math.max(y1,y2)];}
    undoStack.push({snap:d.snap,label:d.type==="node"?"Di chuyển điểm":d.type==="bld"?"Di chuyển tòa nhà":"Đổi kích thước tòa nhà"});redoStack=[];afterChange();
  }else if(d.type==="pan"&&d.empty&&!d.moved){select(null);}
  else if(d.type==="rect"){
    const x1=Math.min(d.x0,d.x1),y1=Math.min(d.y0,d.y1),x2=Math.max(d.x0,d.x1),y2=Math.max(d.y0,d.y1);
    if(x2-x1<8||y2-y1<8){toast("Kéo rộng hơn để vẽ khung tòa nhà.");render();return;}
    const id=newId("toa_moi",k=>BM.has(k));
    mutate("Thêm tòa nhà",()=>{D.buildings.push({id,label:"Tòa mới",rect:[x1,y1,x2,y2],floors:3,kind:"clinic"});});
    select({k:"bld",id});setTool("select");
  }else render();
});
cv.addEventListener("pointerleave",()=>{if(!drag){hover=null;mouseM=null;guides=null;render();}});
cv.addEventListener("wheel",e=>{
  e.preventDefault();const [sx,sy]=pt(e),[mx,my]=toM(sx,sy);
  const ns=Math.min(6,Math.max(.08,view.s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015))));view.s=ns;view.ox=sx-mx*ns;view.oy=sy-my*ns;
  $("#coord").textContent=`x ${Math.round(mx)} · y ${Math.round(my)} · ${Math.round(view.s*100)}%`;render();
},{passive:false});

function connectClick(mx,my,h,alt){
  if(!connectFrom){
    if(h&&h.k==="node"){connectFrom=h.id;select({k:"node",id:h.id});updateHint();render();return;}
    let id;mutate("Thêm ngã rẽ",()=>{id=createNode("junction",mx,my,h&&h.k==="seg"?h:null,alt);});connectFrom=id;select({k:"node",id});updateHint();return;
  }
  if(h&&h.k==="node"&&h.id===connectFrom){connectFrom=null;updateHint();render();return;}
  const from=connectFrom;let to=null,dup=false;
  mutate("Nối đường",()=>{
    to=h&&h.k==="node"?h.id:createNode("junction",mx,my,h&&h.k==="seg"?h:null,alt);
    if(D.segs.some(s=>(s.a===from&&s.b===to)||(s.a===to&&s.b===from))){dup=true;if(h&&h.k==="node")return false;return;}
    D.segs.push({a:from,b:to});
  });
  if(dup)toast("Hai điểm này đã được nối với nhau.");
  connectFrom=to;select({k:"node",id:to});updateHint();
}
function deleteObj(h){
  if(h.k==="node")deleteNode(h.id);
  else if(h.k==="seg"){const sg=D.segs[h.i];mutate(`Xóa đoạn ${nodeLabel(sg.a)} – ${nodeLabel(sg.b)}`,()=>{D.segs.splice(h.i,1);});}
  else if(h.k==="bld")deleteBuilding(h.id);
  else if(h.k==="gate")mutate("Xóa khung cổng",()=>{D.gates.splice(h.i,1);});
}
function deleteNode(id){
  const n=NM.get(id);if(!n)return;let addedOld=false;
  mutate("Xóa điểm "+id,()=>{
    D.nodes=D.nodes.filter(x=>x.id!==id);D.segs=D.segs.filter(s=>s.a!==id&&s.b!==id);
    D.places.forEach(p=>p.doors=p.doors.filter(d=>d!==id));delete D.gateFacing[id];
    Object.keys(D.oldIds).forEach(k=>{if(D.oldIds[k]===id)D.oldIds[k]=null;});
    if(n.type!=="junction"&&baseHasNode(id)){D.oldIds[id]=null;addedOld=true;}
  });
  if(addedOld)toast(`Đã xóa. Mã "${id}" được đưa vào danh sách mã cũ để QR đã in vẫn mở được trang.`,5000);
}
function deleteBuilding(id){
  const b=BM.get(id);if(!b)return;
  mutate("Xóa tòa nhà "+(b.label||id),()=>{D.buildings=D.buildings.filter(x=>x.id!==id);D.places.forEach(p=>{if(p.building===id)delete p.building;});});
}
function renameNode(old,neu,keepOld){
  if(!NODE_ID_RE.test(neu)){toast("Mã chỉ được dùng chữ thường không dấu, số và dấu _.");return false;}
  if(NM.has(neu)){toast(`Mã "${neu}" đã có điểm khác dùng.`);return false;}
  mutate(`Đổi mã ${old} → ${neu}`,()=>{
    const n=NM.get(old);n.id=neu;
    D.segs.forEach(s=>{if(s.a===old)s.a=neu;if(s.b===old)s.b=neu;});
    D.places.forEach(p=>p.doors=p.doors.map(d=>d===old?neu:d));
    if(old in D.gateFacing){D.gateFacing[neu]=D.gateFacing[old];delete D.gateFacing[old];}
    Object.keys(D.oldIds).forEach(k=>{if(D.oldIds[k]===old)D.oldIds[k]=neu;});
    delete D.oldIds[neu];
    if(keepOld&&n.type!=="junction"&&baseHasNode(old))D.oldIds[old]=neu;
  });
  SEL={k:"node",id:neu};if(connectFrom===old)connectFrom=neu;refreshPanel();return true;
}
function renamePlace(old,neu){
  if(!PLACE_ID_RE.test(neu)){toast("Mã điểm đến chỉ được dùng chữ, số và dấu _.");return false;}
  if(PM.has(neu)){toast(`Mã "${neu}" đã có điểm đến khác dùng.`);return false;}
  mutate(`Đổi mã điểm đến ${old} → ${neu}`,()=>{PM.get(old).id=neu;D.buildings.forEach(b=>{if(b.place===old)b.place=neu;});D.gates.forEach(g=>{if(g.place===old)g.place=neu;});});
  curPlace=neu;refreshPanel();return true;
}
function renameBuilding(old,neu){
  if(!neu){toast("Mã khối nhà không được để trống.");return false;}
  if(BM.has(neu)){toast(`Mã "${neu}" đã có khối nhà khác dùng.`);return false;}
  mutate(`Đổi mã tòa ${old} → ${neu}`,()=>{BM.get(old).id=neu;D.places.forEach(p=>{if(p.building===old)p.building=neu;});});
  SEL={k:"bld",id:neu};refreshPanel();return true;
}
function addDoorToPlace(pid,nid){
  const p=PM.get(pid),n=NM.get(nid);if(!p||!n)return;
  if(n.type==="junction"){toast("Ngã rẽ không làm cửa được. Hãy chọn một cửa hoặc cổng, hoặc đổi loại điểm này thành Cửa.");return;}
  if(p.doors.includes(nid)){toast("Cửa này đã có trong điểm đến.");return;}
  mutate(`Thêm cửa vào ${p.name}`,()=>{p.doors.push(nid);});toast(`Đã thêm "${n.name}" vào ${p.name}.`);
}

function setTool(t){
  tool=t;if(t!=="connect")connectFrom=null;pickDoorFor=null;
  TOOLS.forEach(([id])=>{const b=$("#t-"+id);if(b)b.setAttribute("aria-pressed",String(id===t));});updateHint();render();

function updateHint(){

document.addEventListener("keydown",e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||"";const typing=/INPUT|TEXTAREA|SELECT/.test(tag);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();openSave();return;}
  if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===" "){spaceDown=true;cv.style.cursor="grab";e.preventDefault();return;}
  if(e.key==="Escape"){if(pickDoorFor){pickDoorFor=null;updateHint();refreshPanel();return;}if(connectFrom){connectFrom=null;updateHint();render();return;}select(null);return;}
  if(e.key==="Delete"||e.key==="Backspace"){if(SEL){e.preventDefault();deleteObj(SEL);}return;}
  const k=e.key.toLowerCase(),t=TOOLS.find(x=>x[2].toLowerCase()===k);
  if(t){setTool(t[0]);return;}
  if(k==="f")fitAll();else if(k==="i")$("#t-ids").click();
});
document.addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;cv.style.cursor="";}});

const TABS=[["obj","Đối tượng"],["places","Khoa phòng"],["list","Danh sách"],["check","Kiểm tra"],["other","Khác"],["hist","Lịch sử"]];
function refreshTabs(){
  const t=$("#tabs");t.innerHTML="";

    const b=h("button",{role:"tab","aria-selected":String(activeTab===id),onclick:()=>{activeTab=id;refreshPanel();render();}},l);
    if(id==="check"&&V.errors.length)b.append(h("span",{class:"cnt"},V.errors.length));
    else if(id==="check"&&V.warnings.length)b.append(h("span",{class:"cnt w"},V.warnings.length));

function refreshPanel(){
  refreshTabs();const body=$("#tabBody"),sc=body.scrollTop;body.innerHTML="";
  ({obj:tabObj,places:tabPlaces,list:tabList,check:tabCheck,other:tabOther,hist:tabHist})[activeTab](body);

function select(s){SEL=s;if(s&&activeTab!=="obj"&&activeTab!=="places")activeTab="obj";if(s&&activeTab==="places"&&s.k!=="node")activeTab="obj";refreshPanel();render();}
function focusRef(ref){
  if(!ref)return;
  if(ref.k==="node"){const n=NM.get(ref.id);if(n){SEL=ref;activeTab="obj";centerOn(+n.x,+n.y,.9);}}
  else if(ref.k==="seg"){const sg=D.segs[ref.i],a=sg&&NM.get(sg.a),b=sg&&NM.get(sg.b);SEL=ref;activeTab="obj";if(a&&b)centerOn((+a.x+ +b.x)/2,(+a.y+ +b.y)/2,.9);}
  else if(ref.k==="bld"){const b=BM.get(ref.id);if(b){SEL=ref;activeTab="obj";centerOn((b.rect[0]+b.rect[2])/2,(b.rect[1]+b.rect[3])/2);}}
  else if(ref.k==="gate"){SEL=ref;activeTab="obj";const g=D.gates[ref.i];if(g)centerOn((g.x1+g.x2)/2,g.y);}
  else if(ref.k==="place"){curPlace=ref.id;activeTab="places";const p=PM.get(ref.id),b=p&&p.building&&BM.get(p.building);if(b)centerOn((b.rect[0]+b.rect[2])/2,(b.rect[1]+b.rect[3])/2);}

}

function hideBanner(){$("#banner").hidden=true;}
function checkDraft(){
  const dr=LS.get(DRAFT_KEY,null);if(!dr||!dr.data||dr.data===baseNorm)return;
  const changed=dr.base!==baseNorm;
  showBanner(`Có bản nháp chưa lưu trên máy này, từ ${fmtTime(dr.t)}.${changed?" <b>Lưu ý:</b> bản đang dùng đã được sửa sau lúc đó; mở nháp sẽ ghi đè các sửa đổi kia khi lưu.":""}`,[
    h("button",{class:"btn primary",onclick:()=>{try{const j=JSON.parse(dr.data);mutate("Mở bản nháp",()=>{D=toInternal(j);});hideBanner();toast("Đã mở bản nháp.");}catch(e){toast("Bản nháp bị hỏng.");}}},"Mở bản nháp"),
    h("button",{class:"btn",onclick:()=>{LS.del(DRAFT_KEY);hideBanner();}},"Bỏ bản nháp")]);
}
addEventListener("beforeunload",e=>{if(isDirty()){e.preventDefault();e.returnValue="";}});

// =====================================================================
// GITHUB
// =====================================================================
function ghCfg(){const c=LS.get(GH_KEY,{});return {owner:c.owner||"",repo:c.repo||"",branch:c.branch||"main",path:c.path||"public/map_data.json",token:c.token||""};}
const ghReady=c=>!!(c.owner&&c.repo&&c.token);
function ghErr(status,m){
  if(status===401)return "Mã truy cập (token) sai hoặc đã hết hạn. Tạo token mới và nhập lại trong Cài đặt GitHub.";
  if(status===403)return "Token không có quyền với kho này. Cần quyền Contents: Read and write, và kho phải nằm trong danh sách được chọn.";
  if(status===404)return "Không tìm thấy kho hoặc file. Kiểm tra lại tên tài khoản, tên kho, nhánh và đường dẫn file.";
  if(status===409)return "Có xung đột: file vừa được người khác lưu. Tải lại trang để lấy bản mới.";
  if(status===422)return "GitHub từ chối yêu cầu: "+(m||"dữ liệu không hợp lệ")+".";
  return `GitHub báo lỗi ${status}${m?": "+m:""}.`;
}
async function gh(c,path,opt={}){
  let r;
  try{r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/${path}`,Object.assign({},opt,{headers:Object.assign({Accept:"application/vnd.github+json",Authorization:"Bearer "+c.token},opt.body?{"Content-Type":"application/json"}:{})}));}
  catch(e){throw new Error("Không kết nối được tới GitHub. Kiểm tra mạng của máy, hoặc tường lửa bệnh viện có chặn api.github.com không.");}
  if(!r.ok){let m="";try{m=(await r.json()).message;}catch(e){}throw new Error(ghErr(r.status,m));}
  return r.json();
}
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
async function ghGet(c,ref){const d=await gh(c,`contents/${encPath(c.path)}?ref=${encodeURIComponent(ref||c.branch)}`);return {text:b64dec(d.content||""),sha:d.sha};}
async function ghPut(c,text,sha,message){return gh(c,`contents/${encPath(c.path)}`,{method:"PUT",body:JSON.stringify({message,content:b64enc(text),sha,branch:c.branch})});}

// ---- cài đặt
const dSet=$("#dlgSettings");
function openSettings(){const c=ghCfg();$("#gOwner").value=c.owner;$("#gRepo").value=c.repo;$("#gBranch").value=c.branch;$("#gPath").value=c.path;$("#gToken").value=c.token;$("#gWho").value=LS.get(WHO_KEY,"");$("#gOut").hidden=true;dSet.showModal();}
const readSet=()=>({owner:$("#gOwner").value.trim(),repo:$("#gRepo").value.trim(),branch:$("#gBranch").value.trim()||"main",path:$("#gPath").value.trim()||"public/map_data.json",token:$("#gToken").value.trim()});
function setOut(el,cls,html){el.className="msg "+cls;el.innerHTML=html;el.hidden=false;}
$("#bSettings").onclick=openSettings;$("#gCancel").onclick=()=>dSet.close();
$("#gTest").onclick=async()=>{const c=readSet(),out=$("#gOut");if(!ghReady(c)){setOut(out,"bad","Cần nhập tài khoản, tên kho và token.");return;}
  setOut(out,"","Đang kiểm tra…");
  try{const r=await ghGet(c);JSON.parse(r.text);setOut(out,"ok",`Kết nối được. Đọc được file <span class=mono>${esc(c.path)}</span> (${Math.round(r.text.length/1024)} KB).`);}catch(e){setOut(out,"bad",esc(e.message));}};
$("#gSave").onclick=async()=>{
  const c=readSet();LS.set(GH_KEY,c);LS.set(WHO_KEY,$("#gWho").value.trim());dSet.close();histCache=null;
  if(ghReady(c)&&!isDirty()){try{const r=await ghGet(c);setBase(r.text,r.sha,"GitHub");D=toInternal(JSON.parse(r.text));undoStack=[];redoStack=[];afterChange();toast("Đã nối GitHub và tải bản mới nhất.");}catch(e){toast(e.message,6000);}}
  else{updateStatus();toast("Đã lưu cài đặt.");}
};
$("#gForget").onclick=()=>{const c=ghCfg();c.token="";LS.set(GH_KEY,c);$("#gToken").value="";setOut($("#gOut"),"ok","Đã xóa token khỏi máy này.");updateStatus();};

// ---- lưu
const dSave=$("#dlgSave");
function diffSummary(){
  const b=baseInternal,c=D,lines=[];
  const cmp=(label,A,B,key,name)=>{const ma=new Map(A.map(x=>[key(x),x])),mb=new Map(B.map(x=>[key(x),x]));const add=[],del=[],chg=[];
    mb.forEach((v,k)=>{if(!ma.has(k))add.push(name(v));else if(JSON.stringify(ma.get(k))!==JSON.stringify(v))chg.push(name(v));});ma.forEach((v,k)=>{if(!mb.has(k))del.push(name(v));});
    const parts=[];const short=a=>a.slice(0,4).join(", ")+(a.length>4?` và ${a.length-4} mục khác`:"");
    if(add.length)parts.push(`thêm ${short(add)}`);if(chg.length)parts.push(`sửa ${short(chg)}`);if(del.length)parts.push(`xóa ${short(del)}`);
    if(parts.length)lines.push({label,text:parts.join("; "),n:add.length+chg.length+del.length});};
  cmp("Điểm",b.nodes,c.nodes,x=>x.id,x=>x.name||x.landmark||x.id);
  cmp("Điểm đến, khoa phòng",b.places,c.places,x=>x.id,x=>x.name);
  cmp("Khối nhà",b.buildings,c.buildings,x=>x.id,x=>x.label||x.id);
  const sk=s=>[s.a,s.b].sort().join("|");
  cmp("Đoạn đường",b.segs,c.segs.map(s=>Object.assign({},s,s.a>s.b?{a:s.b,b:s.a}:{})),sk,s=>`${nodeLabel(s.a)} – ${nodeLabel(s.b)}`);
  const other=[["config","cấu hình"],["gates","khung cổng"],["gateFacing","hướng nhìn"],["oldIds","mã QR cũ"],["quickSearches","nút tìm nhanh"],["decor","trang trí bản đồ"]].filter(([k])=>JSON.stringify(b[k])!==JSON.stringify(c[k])).map(x=>x[1]);
  if(other.length)lines.push({label:"Khác",text:"sửa "+other.join(", "),n:other.length});
  return lines;
}
function openSave(){
  const c=ghCfg();if(!ghReady(c)){openSettings();toast("Nhập cài đặt GitHub trước khi lưu.");return;}
  const out=$("#saveOut");out.hidden=true;$("#saveGo").disabled=false;$("#saveGo").textContent="Lưu";$("#saveActs").querySelectorAll(".extra").forEach(x=>x.remove());
  const sum=$("#saveSummary");sum.innerHTML="";
  if(V.errors.length){sum.append(h("div",{class:"msg bad"},`Còn ${V.errors.length} lỗi trong dữ liệu. Sửa hết lỗi ở thẻ Kiểm tra rồi mới lưu được, để không làm hỏng trang của người bệnh.`));$("#saveGo").disabled=true;}
  else if(!isDirty()){sum.append(h("div",{class:"msg ok"},"Không có thay đổi nào so với bản đang dùng."));$("#saveGo").disabled=true;}
  else{const d=diffSummary();sum.append(h("ul",{class:"sum"},d.map(x=>h("li",null,h("b",null,x.label+": "),x.text))));
    if(V.warnings.length)sum.append(h("div",{class:"msg warn"},`Có ${V.warnings.length} cảnh báo. Vẫn lưu được, nhưng nên xem lại ở thẻ Kiểm tra.`));
    $("#saveMsg").value="Cập nhật bản đồ: "+d.map(x=>x.label.toLowerCase()).join(", ");}
  $("#saveWho").value=LS.get(WHO_KEY,"");
  dSave.showModal();
}
$("#bSave").onclick=openSave;$("#saveCancel").onclick=()=>dSave.close();
$("#saveGo").onclick=()=>doSave(false);
async function doSave(force){
  const c=ghCfg(),out=$("#saveOut"),go=$("#saveGo");
  const who=$("#saveWho").value.trim();LS.set(WHO_KEY,who);
  const msg=($("#saveMsg").value.trim()||"Cập nhật bản đồ")+(who?`\n\nNgười sửa: ${who}`:"");
  go.disabled=true;go.textContent="Đang lưu…";$("#saveActs").querySelectorAll(".extra").forEach(x=>x.remove());
  try{
    const remote=await ghGet(c);
    if(!force){
      let changed;if(baseSha)changed=remote.sha!==baseSha;else{try{changed=normalizeText(remote.text)!==baseNorm;}catch(e){changed=true;}}
      if(changed){
        setOut(out,"warn","Bản trên GitHub đã được sửa sau khi bạn mở trang này (có thể bởi người khác). Nếu lưu, các sửa đổi kia sẽ bị ghi đè. Bạn có thể tải file của mình về để giữ lại, rồi tải lại trang để xem bản mới.");
        go.textContent="Lưu";go.disabled=false;
        $("#saveActs").prepend(h("button",{class:"extra danger",onclick:()=>doSave(true)},"Vẫn ghi đè"),h("button",{class:"extra",onclick:()=>$("#bExport").click()},"Tải file của tôi"));
        return;
      }
    }
    const text=current(),res=await ghPut(c,text,remote.sha,msg);
    setBase(text,res.content.sha,"GitHub");LS.del(DRAFT_KEY);histCache=null;afterChange();
    setOut(out,"ok",`Đã lưu. Trang người bệnh sẽ cập nhật sau khoảng 1–2 phút, khi Netlify đăng xong. <a href="${esc(res.commit.html_url)}" target="_blank" rel="noopener">Xem lần lưu này trên GitHub</a>`);
    go.textContent="Đã lưu";
  }catch(e){setOut(out,"bad",esc(e.message));go.disabled=false;go.textContent="Thử lại";}
}

// KHỞI ĐỘNG
// =====================================================================
async function loadText(){
  const c=ghCfg();
  if(ghReady(c)){try{const r=await ghGet(c);JSON.parse(r.text);return {text:r.text,sha:r.sha,src:"GitHub"};}catch(e){toast("Không đọc được từ GitHub: "+e.message+" Đang dùng bản trên trang web.",7000);}}
  for(const u of ["../map_data.json","map_data.json","/map_data.json"]){try{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)continue;const t=await r.text();JSON.parse(t);return {text:t,sha:null,src:"trang web"};}catch(e){}}
  return null;
}
(async function boot(){
  readColors();buildTools();updateHint();
  const r=await loadText();
  if(!r){$("#app").innerHTML=`<div id="fatal"><h2>Không tải được dữ liệu bản đồ</h2><p>Trang quản trị cần đọc file <span class="mono">map_data.json</span> ở thư mục gốc của trang web. Kiểm tra file đã được đăng lên chưa, rồi tải lại trang. Nếu chạy trên máy, hãy mở bằng máy chủ thử (<span class="mono">python -m http.server</span>) thay vì bấm đúp vào file.</p></div>`;return;}
  setBase(r.text,r.sha,r.src);D=toInternal(JSON.parse(r.text));reindex();validateAll();
  addEventListener("resize",resize);new ResizeObserver(resize).observe(stage);resize();fitAll();
  refreshPanel();updateStatus();checkDraft();
  const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener("change",()=>{readColors();render();});
  new MutationObserver(()=>{readColors();render();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  window.__ed={get D(){return D;},toInternal,toExternal,serialize,compressSegs,validateAll,get V(){return V;}};
})();
})();
</script>
