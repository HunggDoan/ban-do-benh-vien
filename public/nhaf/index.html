<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản đồ nhà F (nhà 10 tầng)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: bản đồ 3D phủ kín màn hình. Điện thoại: thẻ trên cùng (tìm kiếm / chỉ dẫn) + ngăn kéo dưới đáy. Máy tính: hai thẻ xếp ở cột trái rộng 400px. */
:root{
  --bg:#eef2f8; --panel:#ffffff; --ink:#0f1b2d; --mute:#5b6b82; --line:#e1e7f0; --soft:#f3f6fb;
  --primary:#1b5cff; --primary-2:#0f46d8; --primary-ink:#ffffff; --primary-soft:#e8efff;
  --danger:#e5484d; --ok:#18a058; --warn:#f2a20c; --scene:#e7ecf3;
  --ff:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 6px 24px rgba(15,27,45,.12),0 1px 3px rgba(15,27,45,.08);
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --panel:#161e2c; --ink:#e8eef8; --mute:#94a3ba; --line:#263247; --soft:#1c2637;
  --primary:#4d82ff; --primary-2:#3a6ef0; --primary-ink:#ffffff; --primary-soft:#1d2b4a; --scene:#121a27;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --panel:#161e2c; --ink:#e8eef8; --mute:#94a3ba; --line:#263247; --soft:#1c2637;
  --primary:#4d82ff; --primary-2:#3a6ef0; --primary-ink:#ffffff; --primary-soft:#1d2b4a; --scene:#121a27;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;background:var(--scene)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}

/* nhãn trên bản đồ */
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;line-height:1.2;font-weight:600;color:#33425a;
  background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(15,27,45,.15)}
.lb.ico{display:flex;align-items:center;gap:5px;padding:3px 7px 3px 3px;border-radius:9px;font-size:11px;color:#0f1b2d}
.lb.ico i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.lb.ico i svg{width:13px;height:13px}
.lb.side{background:transparent;box-shadow:none;color:var(--mute);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.lb.tap{pointer-events:auto;cursor:pointer}
.lb.tap:active{filter:brightness(.9)}
.lb.ftag{background:var(--panel);color:var(--ink);font-size:12px;pointer-events:auto;cursor:pointer;padding:5px 9px;border-radius:9px}
.lb.ftag b{color:var(--primary);margin-right:6px}
.lb.here{background:var(--primary);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:10px;box-shadow:0 4px 12px rgba(27,92,255,.35)}
.lb.dest{background:#fff;color:#0f1b2d;font-size:12.5px;padding:6px 10px;border-radius:10px;border:2px solid var(--danger)}

/* khung giao diện */
#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui > *{pointer-events:auto}
#topArea{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
#sheet{width:100%;max-width:420px;max-height:min(52vh,560px);display:flex;flex-direction:column;overflow:hidden}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
#sheetBody{overflow:auto;padding:6px 16px 16px;min-height:0}
@media (min-width:900px){
  #ui{justify-content:flex-start;gap:12px}
  #sheet{max-height:none;flex:1 1 auto;min-height:0}
  #sheet .grab{display:none}
}

/* thẻ tìm kiếm */
.brand{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:800;line-height:1.2}
.brand p{margin:0;font-size:12px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;margin:10px 12px 8px;padding:0 12px;background:var(--soft);border-radius:12px;border:1px solid var(--line)}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;padding:12px 0;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.clear{border:0;background:transparent;color:var(--mute);cursor:pointer;padding:4px;display:grid;place-items:center}
.loc{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px 12px;padding:10px 12px;border:0;border-radius:12px;background:var(--primary-soft);cursor:pointer;text-align:left}
.loc .dot{width:14px;height:14px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 25%,transparent);flex:none}
.loc span{flex:1;min-width:0;font-size:13px}
.loc span small{display:block;color:var(--mute);font-size:11.5px}
.loc span b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc svg{color:var(--mute);flex:none}

/* thẻ lộ trình */
.plan{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.plan .hdr{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--primary-soft)}
.plan .hdr h2{margin:0;font-size:15px;font-weight:700;flex:1;text-align:center}
.pt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.pt i{width:14px;height:14px;border-radius:50%;flex:none}
.pt span{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.mode svg{flex:none;color:var(--mute)}
.mode b{display:block;font-size:13px} .mode small{font-size:11.5px;color:var(--mute)}
.mode.on{border-color:var(--primary);background:var(--primary-soft)} .mode.on svg,.mode.on small{color:var(--primary)}

/* thẻ chỉ dẫn khi đang đi */
.navc{background:linear-gradient(160deg,var(--primary),var(--primary-2));color:#fff;border-radius:var(--r);box-shadow:0 10px 28px rgba(27,92,255,.35);overflow:hidden}
.navc .main{display:flex;gap:14px;align-items:center;padding:16px 16px 10px}
.navc .arrow{width:58px;height:58px;flex:none}
.navc .dist{font-size:30px;font-weight:800;line-height:1}
.navc .dist small{font-size:15px;font-weight:600;margin-left:3px}
.navc .what{font-size:16px;font-weight:600;line-height:1.3;margin-top:4px}
.navc .what small{display:block;font-size:13px;font-weight:500;opacity:.9}
.navc .speak{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;align-self:flex-start}
.navc .speak[aria-pressed="false"]{opacity:.6}
.dots{display:flex;gap:6px;align-items:center;padding:0 16px 12px}
.dots i{height:6px;flex:1;border-radius:3px;background:rgba(255,255,255,.3)}
.dots i.done{background:rgba(255,255,255,.85)} .dots i.cur{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.navc .next{background:rgba(255,255,255,.14);padding:9px 16px;font-size:13px;font-weight:500}

/* nội dung ngăn dưới */
.h3{margin:6px 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.h3 small{font-size:12px;font-weight:500;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:4px 2px;border-radius:12px;font-size:11.5px;line-height:1.25;text-align:center;color:var(--ink)}
.tile i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tile i svg{width:22px;height:22px}
.tile:hover i,.tile:focus-visible i{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,27,45,.12)}
.tile:focus-visible{outline:2px solid var(--primary)}
.floorinfo{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:12px;border-radius:12px;background:var(--soft);font-size:13px}
.floorinfo b{font-size:13.5px}
.floorinfo span{color:var(--mute)}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left}
.res:last-child{border-bottom:0}
.res i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.res i svg{width:17px;height:17px}
.res span{flex:1;min-width:0}
.res b{display:block;font-size:14px;font-weight:600}
.res small{color:var(--mute);font-size:12px}
.res em{font-style:normal;color:var(--mute)}
.empty{color:var(--mute);font-size:13.5px;padding:12px 2px;line-height:1.5}
.sum{display:flex;align-items:center;gap:12px;padding:4px 0 10px}
.sum .big{font-size:28px;font-weight:800;line-height:1}
.sum .big small{font-size:14px;font-weight:600;color:var(--mute);margin-left:6px}
.sum .tag{margin-left:auto;font-size:12px;color:var(--mute);text-align:right}
.btnP{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:15.5px;font-weight:700;padding:14px;cursor:pointer;box-shadow:0 6px 16px rgba(27,92,255,.3)}
.btnP:hover{background:var(--primary-2)}
.btnS{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.btnS:hover{border-color:var(--primary)}
.row{display:flex;gap:8px;align-items:center}
.link{border:0;background:transparent;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;padding:6px 0}
ol.steps{list-style:none;margin:4px 0 12px;padding:0;position:relative}
ol.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
ol.steps li::before{content:"";position:absolute;left:14px;top:-8px;bottom:50%;border-left:2px dashed var(--line)}
ol.steps li:first-child::before{display:none}
ol.steps .si{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--panel);color:var(--primary);position:relative;z-index:1}
ol.steps .si svg{width:20px;height:20px}
ol.steps li b{font-weight:700}
ol.steps .t{font-size:13.5px;line-height:1.4}
ol.steps .t small{display:block;color:var(--mute);font-size:12px}
ol.steps .m{font-size:12px;color:var(--mute);white-space:nowrap}
.navbot{display:flex;flex-direction:column;gap:10px}
.dest{display:flex;align-items:center;gap:10px}
.dest .pinI{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;flex:none}
.dest b{display:block;font-size:15px} .dest small{color:var(--mute);font-size:12.5px}
.exit{margin-left:auto;border:0;background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.stats{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.stats b{color:var(--ink);font-size:14px}
.stepbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.stepbtns .btnP{padding:12px}
.note{font-size:11.5px;color:var(--mute);line-height:1.45}

/* điều khiển bản đồ bên phải */
#mapctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto}
#floors{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
#floors button{width:42px;height:40px;border-radius:10px;border:0;background:transparent;font-weight:700;font-size:14px;cursor:pointer;position:relative}
#floors button.on{background:var(--primary);color:#fff}
#floors button.rt::after{content:"";position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
#floors .all{font-size:10.5px;line-height:1.1;font-weight:700}
.ctl{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.ctl.on{background:var(--primary);color:#fff}
button:focus-visible,.pt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (max-width:899px){
  #ui{justify-content:flex-start}
  #topArea{order:1} #mapctl{order:2;position:static;transform:none;flex-direction:column;align-self:flex-end;margin:auto 0;gap:8px}
  #sheet{order:3;max-height:40vh} #floors{flex-direction:column;gap:4px;padding:5px}
  #floors button{width:42px;height:38px} .ctl{width:42px;height:42px}
  #ui.planmode #sheet,#ui.navmode #sheet{max-height:36vh}
  .brand p{display:none}
}
/* hộp chọn vị trí */
#picker{position:absolute;inset:0;background:rgba(10,18,32,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
#picker .card{width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
#picker .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#picker h2{margin:0;font-size:16px}
#picker .bd{overflow:auto;padding:4px 16px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Bản đồ 3D tòa F, tầng 1 đến tầng 3"></canvas>
  <div id="labels"></div>
  <div id="ui">
    <div id="topArea">
      <div class="card" id="homeCard">
        <div class="brand">
          <a class="logo" href="../" aria-label="Về trang chủ" style="text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></a>
          <div><h1>Bản đồ nhà F (nhà 10 tầng)</h1><p>Bệnh viện Sản Nhi Nghệ An · đang có tầng 1 đến tầng 3</p></div>
        </div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="text" enterkeyhint="search" placeholder="Tìm khoa, phòng, dịch vụ…" autocomplete="off" aria-label="Tìm khoa, phòng, dịch vụ">
          <button class="clear" id="qx" hidden aria-label="Xóa ô tìm"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1Z"/></svg></button>
        </label>
        <button class="loc" id="locBtn"><i class="dot"></i><span><small>Bạn đang ở (theo mã QR)</small><b id="locName">…</b></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="card" id="planCard" hidden>
        <div class="plan">
          <div class="hdr"><button class="iconbtn" id="planBack" aria-label="Quay lại"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button><h2>Tìm đường đi</h2><span style="width:36px"></span></div>
          <button class="pt" id="ptFrom"><i style="background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)"></i><span id="ptFromT"></span></button>
          <button class="pt" id="ptTo"><i style="background:var(--danger)"></i><span id="ptToT"></span></button>
          <div class="modes">
            <button class="mode on" id="mWalk"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="13" cy="4" r="2"/><path d="M10.5 8.5 8 21h2.2l1.6-7 2.2 2.2V21h2v-6.2l-2.2-2.2.6-3A6.5 6.5 0 0 0 19 12v-2a4.5 4.5 0 0 1-3.8-2.1l-1-1.6A2 2 0 0 0 12.6 5.4L7 7.8V12h2V9.1z"/></svg><span><b>Đi bộ</b><small id="tWalk">–</small></span></button>
            <button class="mode" id="mWheel"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="10" cy="4" r="2"/><path d="M9 8h2v5h5l2.6 5.2-1.8.9L14.8 15H9a1 1 0 0 1-1-1V8Zm-1.4 3.2.4 2A4 4 0 1 0 13.9 18h2.1A6 6 0 1 1 7.6 11.2Z"/></svg><span><b>Xe lăn</b><small id="tWheel">–</small></span></button>
          </div>
        </div>
      </div>
      <div class="navc" id="navCard" hidden>
        <div class="main">
          <svg class="arrow" id="navArrow" viewBox="0 0 64 64"></svg>
          <div><div class="dist" id="navDist"></div><div class="what" id="navWhat"></div></div>
          <button class="speak" id="speak" aria-pressed="false" aria-label="Đọc to chỉ dẫn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg></button>
        </div>
        <div class="dots" id="navDots"></div>
        <div class="next" id="navNext"></div>
      </div>
    </div>
    <div class="card" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
    <div id="mapctl">
      <nav id="floors" aria-label="Chọn tầng"></nav>
      <button class="ctl" id="vTop" aria-label="Đổi góc nhìn 3D / từ trên" title="Đổi góc nhìn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
      <button class="ctl" id="vMe" aria-label="Về vị trí của tôi" title="Về vị trí của tôi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </div>

  const along=(dir<2), L=along?w:d, Wd=along?d:w, head0=(dir===0||dir===2);
  return {L,Wd,put:(b,a0,a1,b0,b1,y0,y1,c,t)=>{ // a từ đầu (0) đến chân (L); b từ 0..Wd
    const A0=head0?a0:L-a1, A1=head0?a1:L-a0;
    if(along) b.box(u+A0,v+b0,A1-A0,b1-b0,y0,y1,c,t); else b.box(u+b0,v+A0,b1-b0,A1-A0,y0,y1,c,t);}};
}

function stairSteps(r){const [u,v,w,d]=r,steps=12,o=[];const along=w>=d;
  for(let i=0;i<steps;i++){const t0=i/steps;o.push([along?[u+w*t0,v,w/steps,d]:[u,v+d*t0,w,d/steps],(i+1)/steps]);}return o;}
function slabGeo(hull){const s=new THREE.Shape(hull.map(p=>new THREE.Vector2(U(p[0]),-V(p[1]))));
  const g=new THREE.ExtrudeGeometry(s,{depth:SLAB,bevelEnabled:false});g.rotateX(-Math.PI/2);return g;}

function decode(s){const a=new Uint8Array(GW*GH);let p=0;for(const tok of s.split(",")){if(!tok)continue;const v=+tok[0],n=parseInt(tok.slice(1),36);a.fill(v,p,p+n);p+=n;}return a;}

const cellOf=(u,v)=>[Math.round((u-G0)/GC-0.5),Math.round((v-G0)/GC-0.5)];
const ptOf=(idx)=>[G0+(idx%GW+0.5)*GC,G0+(Math.floor(idx/GW)+0.5)*GC];
function snap(fi,u,v){const g=floors[fi].grid;const [x,y]=cellOf(u,v);
  for(let r=0;r<40;r++){let best=-1,bd=1e9;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=GW||Y>=GH)continue;
      const k=Y*GW+X;if(g[k]&&reach[fi][k]){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=k;}}}
    if(best>=0)return best;}
  return -1;}
// vùng liên thông chính của mỗi tầng (tránh chọn ô bị kẹt)
const reach=floors.map(o=>{const g=o.grid,m=new Uint8Array(GW*GH);let best=null,bs=0;const seen=new Int32Array(GW*GH).fill(-1);let id=0;
  for(let s=0;s<g.length;s++){if(!g[s]||seen[s]>=0)continue;const st=[s];seen[s]=id;let n=0;
    while(st.length){const k=st.pop();n++;const x=k%GW,y=(k-x)/GW;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=GW||Y>=GH)continue;const q=Y*GW+X;if(g[q]&&seen[q]<0){seen[q]=id;st.push(q);}}}
    if(n>bs){bs=n;best=id;}id++;}
  for(let k=0;k<g.length;k++) if(seen[k]===best) m[k]=1; return m;});
function dijkstra(fi,src,dst){ // trả về {dist,prev}

  while(hk.length){const [k,d]=pop();if(d>dist[k])continue;if(k===dst)break;const x=k%GW,y=(k-x)/GW,ck=g[k];
    for(const [dx,dy,s] of D){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=GW||Y>=GH)continue;const q=Y*GW+X;const cq=g[q];if(!cq)continue;

function findRoute(startObj,destFi,room,allowStairs){
  const sf=startObj.f, src=snap(sf,startObj.u,startObj.v);

  if(sf===destFi){const {prev}=dijkstra(sf,src,dst);const c=trace(prev,src,dst);if(!c)return null;return {legs:[{fi:sf,pts:smooth(sf,c)}],via:null};}

const heading=(a,b)=>(Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI+360)%360;
const turnOf=(d)=>{d=((d+540)%360)-180;return Math.abs(d)<30?"thẳng":Math.abs(d)>150?"lại":d>0?"phải":"trái";};
const rm=(m)=>Math.max(1,Math.round(m));

function legSteps(fi,pts,face,dest){

  merge();

    for(let i=1;i<m.length-1;i++) if(m[i].L<1.6){m[i+1].L+=m[i].L;m[i+1].i0=m[i].i0;m.splice(i,1);ch=true;break;}

function buildSteps(R,start,destFi,room){

  .replace(/\bwc\b/gi,"WC").replace(/\bkcb\b/gi,"KCB").replace(/\bnv\b/gi,"NV").replace(/\belv\b/gi,"ELV").replace(/\bdsa\b/gi,"DSA").replace(/\bct\b/gi,"CT")
  .replace(/x-quang/g,"X-quang").replace(/\(hạng e\)/gi,"(hạng E)").replace(/\bp\.\s?/gi,"P. ").replace(/\bn\.viên/gi,"Nhân viên").replace(/\b([pn])(\d)/g,(m,a,b)=>a.toUpperCase()+b);}
function el(cls,html){const d=document.createElement("div");d.className="lb "+cls;d.innerHTML=html;LB.appendChild(d);return d;}
const iconLb=(cat,txt)=>`<i style="background:${CAT[cat]}">${SV[cat]}</i>${esc(txt)}`;
function buildLabels(){LB.innerHTML="";labels=[];
  if(mode==="all"){floors.forEach((o,i)=>{const d=el("ftag",`<b>Tầng ${o.F.f}</b>${esc(o.F.dept.map(x=>x[0]).join(" · "))}`);d.onclick=()=>{setFloor(i);overview();};labels.push({el:d,fi:i,ftag:true,pri:100});});}
  else {const o=floors[cur];
    CORES.forEach(c=>{const r=c.rects;const xs=r.map(a=>a[0]),ys=r.map(a=>a[1]),xe=r.map(a=>a[0]+a[2]),ye=r.map(a=>a[1]+a[3]);
      labels.push({el:el("ico",iconLb(c.type,c.short)),u:(Math.min(...xs)+Math.max(...xe))/2,v:(Math.min(...ys)+Math.max(...ye))/2,fi:cur,y:3.4,pri:80,core:c});});
    if(state!=="nav")SIDES.forEach(s=>labels.push({el:el("side",esc(s.t)),u:s.u,v:s.v,fi:cur,y:.3,pri:85}));
    if(o.F.f===1)DOOR1.forEach(d=>labels.push({el:el("ico",iconLb("desk",d.t).replace(SV.desk,SV.room||SV.desk)),u:d.u,v:d.v,fi:cur,y:1.2,pri:90}));
    o.F.rooms.forEach(r=>{const c=catOf(r.n);const big=["wc","pharm","er","money","desk","lab","scan"].includes(c);
      labels.push({el:el(big?"ico":"",big?iconLb(c,nice(r.n).replace(/^Vệ sinh công cộng/,"WC")):esc(nice(r.n))),u:r.u,v:r.v,fi:cur,y:1.6,pri:big?40:20,room:r});});}
  if(state!=="home"&&RT){const last=RT.steps[RT.steps.length-1];
    labels.push({el:el("dest",esc(nice(RT.room.n))),u:last.at[0],v:last.at[1],fi:last.fi,y:4.6,pri:199,always:true});}
  const S=curStart();labels.push({el:el("here","Bạn đang ở đây"),u:S.u,v:S.v,fi:S.f,y:3.4,pri:200,always:true});
  if(state!=="nav")labels.forEach(l=>{if(l.room||l.core){l.el.classList.add("tap");l.el.setAttribute("role","button");l.el.title="Chỉ đường tới đây";
    l.el.onclick=e=>{e.stopPropagation();l.room?planTo(l.fi,l.room):goCore(l.core,l.fi);};}});
  labels.sort((a,b)=>b.pri-a.pri);labels.forEach(l=>{l.w=l.el.offsetWidth;l.h=l.el.offsetHeight;if(RT&&state!=="home"&&l.room===RT.room)l.el.hidden=true;});}
const tmp=new THREE.Vector3();
function placeLabels(){const W=cv.clientWidth,H=cv.clientHeight,boxes=[];
  for(const l of labels){const o=floors[l.fi];if(!o.vis){l.el.style.display="none";continue;}
    if(l.ftag)tmp.set(U(37.8),o.y+.4,V(30));else tmp.set(U(l.u),o.y+SLAB+(l.y||1)*.6,V(l.v));
    tmp.project(camera);if(tmp.z>1||tmp.z<-1){l.el.style.display="none";continue;}
    const x=(tmp.x*.5+.5)*W,y=(-tmp.y*.5+.5)*H;const bx=l.ftag?x+8:x-l.w/2,by=y-l.h/2;let hide=false;
    if(!l.ftag&&!l.always)for(const b of boxes){if(bx<b[2]&&bx+l.w>b[0]&&by<b[3]&&by+l.h>b[1]){hide=true;break;}}
    if(bx<-l.w||bx>W||by<-l.h||by>H)hide=true;
    l.el.style.display=hide?"none":"block";if(!hide){l.el.style.transform=`translate(${bx.toFixed(1)}px,${by.toFixed(1)}px)`;boxes.push([bx-3,by-2,bx+l.w+3,by+l.h+2]);}}}

// ---------- dữ liệu tìm kiếm
const $=id=>document.getElementById(id);
function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();}
const PUBLIC_WC=r=>/WC|VỆ SINH/.test(r.n)&&!/NV|NHÂN VIÊN/.test(r.n);
const ALLROOMS=[];FLOORS.forEach((F,fi)=>{const seen=new Set();F.rooms.forEach(r=>{if(/^(SẢNH THANG|KỸ THUẬT ĐIỆN \+ ELV|WC)$/.test(r.n))return;
  const key=r.n+"|"+Math.round(r.u/3)+"|"+Math.round(r.v/3);if(seen.has(key))return;seen.add(key);ALLROOMS.push({fi,r,key:norm(nice(r.n)),cat:catOf(r.n)});});});
// cách người bệnh hay gọi
const ALIAS=[[/lay mau|thu mau|mau/,/XÉT NGHIỆM MÁU/],[/chup phim|x quang|xquang|chieu/,/X-QUANG/],[/nho rang|rang|nha khoa/,/RĂNG|NHA/],
  [/thanh toan|thu ngan|dong tien|vien phi/,/THANH TOÁN/],[/thuoc|nha thuoc|mua thuoc/,/THUỐC/],[/dang ky|lam thu tuc|tiep don|kham benh/,/THỦ TỤC/],
  [/toilet|nha ve sinh|ve sinh|wc/,/^(WC|VỆ SINH)(?!.*(NV|NHÂN VIÊN))/],[/nuoc tieu|phan/,/LẤY PHÂN/],[/cap cuu/,/CẤP CỨU/],[/sieu am/,/SIÊU ÂM/],[/tai mui hong|tmh/,/TAI MŨI HỌNG/],[/mat|mắt/,/MẮT/]];
function search(qRaw){const q=norm(qRaw.trim());if(!q)return[];const hit=new Map();
  ALLROOMS.forEach(x=>{if(x.key.includes(q))hit.set(x,2);});
  ALIAS.forEach(([a,re])=>{if(a.test(q))ALLROOMS.forEach(x=>{if(re.test(x.r.n)&&!hit.has(x))hit.set(x,1);});});
  return [...hit.entries()].sort((a,b)=>b[1]-a[1]||a[0].fi-b[0].fi||nice(a[0].r.n).localeCompare(nice(b[0].r.n),"vi",{numeric:true})).map(e=>e[0]);}

// ---------- vị trí xuất phát (điểm QR)
let startId=STARTS[0].id;
function curStart(){return STARTS.find(s=>s.id===startId)||STARTS[0];}
function setStart(id,silent){startId=id;const s=curStart();$("locName").textContent=s.name;placeMe(s.f,s.u,s.v,s.h);
  if(!silent){if(RT){planTo(RT.destFi,RT.room);}else{setFloor(s.f);const t=new THREE.Vector3(U(s.u),0,V(s.v));fly(t,new THREE.Vector3(t.x-10,24,t.z+20));buildLabels();}}}
function openPicker(){const L=$("pkList");L.innerHTML="";
  STARTS.forEach(s=>{const b=document.createElement("button");b.className="res";const c=s.id.includes("p")?"lift":"desk";
    b.innerHTML=`<i style="background:${s.id===startId?"var(--primary)":"#94a3b8"}">${SV[s.id.includes("cong")||s.id.includes("capcuu")?"room":"lift"]}</i><span><b>${esc(s.name)}</b><small>Mã QR: ${s.id.toUpperCase()}</small></span>`;
    b.onclick=()=>{$("picker").hidden=true;setStart(s.id);};L.appendChild(b);});
  $("picker").hidden=false;}
$("locBtn").onclick=openPicker;$("ptFrom").onclick=openPicker;$("pkX").onclick=()=>{$("picker").hidden=true;};

// ---------- màn hình

function show(s){state=s;$("sheet").hidden=(s==="home");$("homeCard").hidden=!(s==="home"||s==="search");$("planCard").hidden=s!=="plan";$("navCard").hidden=s!=="nav";
  $("ui").classList.toggle("navmode",s==="nav");$("ui").classList.toggle("planmode",s==="plan");layout();buildLabels();}
const TILES=[["er","Cấp cứu",()=>goName(/SẢNH CẤP CỨU/)],["desk","Làm thủ tục",()=>goName(/THỦ TỤC/)],["lab","Xét nghiệm",()=>doSearch("Xét nghiệm")],["scan","Chẩn đoán hình ảnh",()=>doSearch("Chụp")],
  ["pharm","Nhà thuốc",()=>goName(/QUẦY THUỐC/)],["money","Thanh toán",()=>goName(/THANH TOÁN/)],["wc","WC gần nhất",()=>goNearest("wc")],["lift","Thang máy gần nhất",()=>goNearest("lift")]];
function renderHome(){show("home");SB.innerHTML="";}
function doSearch(t){$("q").value=t;onQ();$("q").focus({preventScroll:true});}
function onQ(){const q=$("q").value;$("qx").hidden=!q;if(!q.trim()){renderHome();return;}show("search");SB.innerHTML="";
  const items=search(q);const h=document.createElement("div");h.className="h3";h.innerHTML=`Kết quả<small>${items.length} nơi</small>`;SB.appendChild(h);
  const nq=norm(q),QK=[[/^(thang may|thang m|tm|lift|thang$)/,"lift","Thang máy gần nhất","lift"],[/^(thang bo|thang b|cau thang|thang$)/,"stair","Thang bộ gần nhất","stair"],[/^(wc|ve sinh|nha ve sinh|toilet|nha vs|vs$)/,"wc","Nhà vệ sinh gần nhất","wc"]];
  QK.filter(([re])=>re.test(nq)).forEach(([,k,t,c])=>{const b=document.createElement("button");b.className="res";
    b.innerHTML=`<i style="background:${CAT[c]||CAT.room}">${SV[c]||SV.room}</i><span><b>${t}</b><small>Tính từ chỗ bạn đang đứng, tầng ${curStart().f+1}</small></span>`;b.onclick=()=>goNearest(k);SB.appendChild(b);});
  if(!items.length&&SB.querySelector(".res"))return;
  if(!items.length){const e=document.createElement("div");e.className="empty";e.textContent="Không thấy nơi nào khớp. Thử gõ ngắn hơn, ví dụ: mắt, chụp, máu, thuốc.";SB.appendChild(e);return;}
  items.slice(0,40).forEach(x=>{const b=document.createElement("button");b.className="res";
    b.innerHTML=`<i style="background:${CAT[x.cat]}">${SV[x.cat]}</i><span><b>${esc(nice(x.r.n))}</b><small>Tầng ${x.fi+1} · <em>${esc(FLOORS[x.fi].dept.map(d=>d[0]).join(", "))}</em></small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color:var(--mute)"><path d="m9 6 6 6-6 6"/></svg>`;
    b.onclick=()=>planTo(x.fi,x.r);SB.appendChild(b);});}
$("q").addEventListener("input",onQ);$("qx").onclick=()=>{$("q").value="";onQ();};
function goName(re){const x=ALLROOMS.find(x=>re.test(x.r.n));if(x)planTo(x.fi,x.r);}
function goCore(c,fi){planTo(fi,{n:c.short.toUpperCase(),u:c.entry[0],v:c.entry[1]});}
function goNearest(kind){const s=curStart();const src=snap(s.f,s.u,s.v);const D=dijkstra(s.f,src,-1).dist;let best=null,bd=Infinity;
  if(kind==="wc"){FLOORS[s.f].rooms.filter(PUBLIC_WC).forEach(r=>{const k=snap(s.f,r.u,r.v);if(k>=0&&D[k]<bd){bd=D[k];best=r;}});}
  else {CORES.filter(c=>kind==="stair"?c.type==="stair":(c.type==="lift"&&c.route===true)).forEach(c=>{const k=snap(s.f,c.entry[0],c.entry[1]);if(k>=0&&D[k]<bd){bd=D[k];best={n:c.short.toUpperCase(),u:c.entry[0],v:c.entry[1]};}});}
  if(best){if(/^WC$/.test(best.n))best={...best,n:"NHÀ VỆ SINH"};planTo(s.f,best);}}

// ---------- lộ trình
let modeWheel=false, ROUTES={};
function planTo(fi,room){const s=curStart();
  const walk=findRoute(s,fi,room,true), wheel=fi===s.f?walk:findRoute(s,fi,room,false);ROUTES={walk,wheel};
  const R=modeWheel?wheel:walk;
  show("plan");$("ptFromT").textContent=s.name;$("ptToT").textContent=nice(room.n)+" · tầng "+(fi+1);
  const tt=(R0,sp)=>{if(!R0)return"không có đường";const L=R0.legs.reduce((a,l)=>a+pathLen(l.pts),0);return`~${Math.max(1,Math.round((L/sp+(R0.via?60:0))/60))} phút`;};
  $("tWalk").textContent=tt(walk,1.0);$("tWheel").textContent=tt(wheel,0.7);
  $("mWalk").classList.toggle("on",!modeWheel);$("mWheel").classList.toggle("on",modeWheel);
  SB.innerHTML="";
  if(!R){clearRouteObjs();RT=null;const e=document.createElement("div");e.className="empty";e.textContent=`Chưa tìm được đường tới ${nice(room.n)}. Hãy chọn lại vị trí đang đứng hoặc hỏi nhân viên gần nhất.`;SB.appendChild(e);buildLabels();return;}
  clearRouteObjs();RT={R,start:s,destFi:fi,room,steps:buildSteps(R,s,fi,room),cur:-1};drawRoute();
  const L=R.legs.reduce((a,l)=>a+pathLen(l.pts),0),sp=modeWheel?0.7:1.0,mins=Math.max(1,Math.round((L/sp+(R.via?60:0))/60));
  const sum=document.createElement("div");sum.className="sum";
  sum.innerHTML=`<div><div class="big">${mins} phút<small>${Math.round(L)} m</small></div></div><div class="tag">${R.via?`Qua ${esc(R.via.name)}<br>tầng ${s.f+1} → tầng ${fi+1}`:`Cùng tầng ${fi+1}`}<br>${RT.steps.filter(x=>x.kind==="move").length} chỗ chỉ dẫn</div>`;SB.appendChild(sum);
  const go=document.createElement("button");go.className="btnP";go.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11 21 3l-8 18-2-8z"/></svg>Bắt đầu dẫn đường`;go.onclick=startNav;SB.appendChild(go);
  const h=document.createElement("div");h.className="h3";h.style.marginTop="14px";h.innerHTML="Chi tiết lộ trình";SB.appendChild(h);
  const ol=document.createElement("ol");ol.className="steps";
  RT.steps.forEach((st,k)=>{const li=document.createElement("li");const col=st.kind==="end"?"var(--danger)":st.kind==="lift"?"#1b5cff":"var(--primary)";
    li.innerHTML=`<span class="si" style="color:${col}"><svg viewBox="0 0 64 64">${turnSvg(st.turn)}</svg></span><span class="t"><b>${esc(st.title)}</b>${st.sub?`<small>${esc(st.sub)}</small>`:""}</span><span class="m">${st.L?rm(st.L)+" m":""}</span>`;
    li.style.cursor="pointer";li.onclick=()=>{const f=st.floorTo!==undefined?st.fi:st.fi;if(cur!==f||mode!=="floor")setFloor(f);followStep(st);};ol.appendChild(li);});
  SB.appendChild(ol);
  const n=document.createElement("p");n.className="note";n.textContent="Khoảng cách tính theo bản vẽ thiết kế, sai lệch vài mét. Thời gian đã cộng khoảng 1 phút chờ thang máy khi phải đổi tầng.";SB.appendChild(n);
  setFloor(s.f);fitPts(R.legs[0].pts.concat([[s.u,s.v]]));
}
$("mWalk").onclick=()=>{modeWheel=false;if(RT)planTo(RT.destFi,RT.room);};
$("mWheel").onclick=()=>{modeWheel=true;if(RT)planTo(RT.destFi,RT.room);};
$("planBack").onclick=()=>{clearRouteObjs();RT=null;if($("q").value.trim())onQ();else renderHome();buildLabels();};
$("ptTo").onclick=()=>{clearRouteObjs();RT=null;onQ();$("q").focus();};

// ---------- dẫn đường từng bước
let speakOn=false;

$("speak").onclick=()=>{speakOn=!speakOn;$("speak").setAttribute("aria-pressed",speakOn);if(speakOn&&RT&&RT.cur>=0)say(stepText(RT.steps[RT.cur]));else try{speechSynthesis.cancel();}catch(e){}};
function startNav(){if(!RT)return;show("nav");RT.cur=RT.steps.length>1?1:0;renderNav();}

  if(cur!==st.fi||mode!=="floor")setFloor(st.fi);
  $("navArrow").innerHTML=turnSvg(st.turn);$("navArrow").style.color="#fff";
  $("navDist").innerHTML=st.kind==="move"?`${rm(st.L)}<small>m</small>`:st.kind==="lift"?`Tầng ${st.floorTo+1}`:st.kind==="end"?"Đã đến":"";
  $("navWhat").innerHTML=`${esc(st.title)}${st.sub?`<small>${esc(st.sub)}</small>`:""}`;
  $("navDots").innerHTML=S.slice(1).map((_,i)=>`<i class="${i+1<RT.cur?"done":i+1===RT.cur?"cur":""}"></i>`).join("");
  const nx=S[RT.cur+1];$("navNext").textContent=nx?`Tiếp theo: ${nx.title}${nx.kind==="move"?` ${rm(nx.L)} m`:""}`:"Bạn đã đến nơi";

  SB.innerHTML=`<div class="navbot"><div class="dest"><span class="pinI"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7Zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg></span>
    <span><b>${esc(nice(RT.room.n))}</b><small>Tầng ${RT.destFi+1} · còn ${Math.round(remain)} m · ${mins} phút</small></span><button class="exit" id="navExit">Thoát</button></div>
    <div class="bar"><i style="width:${total?Math.round((1-remain/total)*100):100}%"></i></div>
    <div class="stepbtns"><button class="btnS" id="navPrev" ${RT.cur<=1?"disabled":""}>Bước trước</button><button class="btnP" id="navGo">${RT.cur>=S.length-1?"Hoàn tất":st.kind==="lift"?`Đã tới tầng ${st.floorTo+1}`:"Tôi đã đi tới · bước tiếp"}</button></div>
    <p class="note">Bấm "bước tiếp" mỗi khi làm xong một chỉ dẫn. Ở sảnh thang máy mỗi tầng có mã QR, quét lại nếu bạn bị lạc.</p></div>`;
  $("navExit").onclick=()=>{RT.cur=-1;try{speechSynthesis.cancel();}catch(e){}planTo(RT.destFi,RT.room);};
  $("navPrev").onclick=()=>{if(RT.cur>1){RT.cur--;renderNav();}};
  $("navGo").onclick=()=>{if(RT.cur>=S.length-1){RT.cur=-1;$("q").value="";renderHome();clearRouteObjs();RT=null;buildLabels();overview();return;}
    if(st.kind==="lift"){setFloor(st.floorTo);}RT.cur++;renderNav();};
  followStep(st.kind==="lift"?st:st);say(stepText(st));buildLabels();
}

// ---------- bảng tầng, góc nhìn
const FB=$("floors");
function renderFloors(){FB.innerHTML="";for(let i=FLOORS.length-1;i>=0;i--){const b=document.createElement("button");b.textContent=FLOORS[i].f;b.setAttribute("aria-label","Tầng "+FLOORS[i].f);
    if(mode==="floor"&&cur===i){b.className="on";b.setAttribute("aria-current","true");}
    if(RT&&RT.R.legs.some(l=>l.fi===i))b.classList.add("rt");
    b.onclick=()=>{setFloor(i);if(RT){const l=RT.R.legs.find(l=>l.fi===i);l?fitPts(l.pts):overview();}else overview();if(state==="home")renderHome();};FB.appendChild(b);}
  const a=document.createElement("button");a.className="all"+(mode==="all"?" on":"");a.innerHTML="Cả<br>toà";a.setAttribute("aria-label","Xem cả 3 tầng");a.onclick=setAll;FB.appendChild(a);}
$("vTop").onclick=()=>{flat=!flat;$("vTop").classList.toggle("on",flat);if(state==="nav"&&RT)followStep(RT.steps[RT.cur]);else if(RT){const l=RT.R.legs.find(l=>l.fi===cur);l?fitPts(l.pts):overview();}else overview();};
$("vMe").onclick=()=>{const s=curStart();setFloor(s.f);const t=new THREE.Vector3(U(s.u),0,V(s.v));fly(t,flat?new THREE.Vector3(t.x,30,t.z+.01):new THREE.Vector3(t.x-8,20,t.z+16));};

// bấm vào phòng trên bản đồ
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null;
cv.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];});
cv.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||state==="nav")return;
  const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const hit=ray.intersectObjects(floors.filter(o=>o.vis).flatMap(o=>[o.slab,o.flo,o.walls,o.furn]))[0];if(!hit)return;const fi=hit.object.userData.floor;
  if(mode==="all"){setFloor(fi);overview();return;}
  const p=floors[fi].g.worldToLocal(hit.point.clone());const u=p.x+OX,v=p.z+OZ;
  let best=null,bd=1e9;for(const rm_ of FLOORS[fi].rooms){const b=rm_.box;const inside=b&&u>=b[0]&&u<=b[0]+b[2]&&v>=b[1]&&v<=b[1]+b[3];const d=Math.hypot(rm_.u-u,rm_.v-v)-(inside?5:0);if(d<bd){bd=d;best=rm_;}}
  if(best&&bd<3)planTo(fi,best);});

// ---------- vòng lặp

window.addEventListener("resize",resize);
const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;const k=reduce?1:1-Math.pow(.0008,dt);
  floors.forEach(o=>{o.y+=(o.ty-o.y)*k;o.h+=(o.th-o.h)*k;o.g.visible=o.vis;o.g.position.y=o.y;o.walls.scale.y=o.h;o.doors.scale.y=o.h;o.glass.scale.y=o.h;o.mull.scale.y=o.h;o.glass.visible=o.mull.visible=(mode==="floor");});
  shaft.visible=mode==="all";shaft.scale.y=floors[floors.length-1].y+2;
  if(RT&&RT.objs)RT.objs.forEach(m=>{const vv=m.userData.vert;if(vv){m.visible=mode==="all";const y0=floors[vv.f0].y+SLAB,y1=floors[vv.f1].y+SLAB;m.position.set(U(vv.u),(y0+y1)/2,V(vv.v));m.scale.y=Math.abs(y1-y0)||.01;}
    if(m.userData.bob&&!reduce)m.position.y=Math.sin(now/300)*.12;});
  if(!reduce){TEX_BLUE.offset.x-=dt*1.4;const ph=(now%1600)/1600;const halo=ME.children[0];halo.scale.set(1+ph*1.6,1,1+ph*1.6);halo.material.opacity=.32*(1-ph);}
  if(flyT){const t=Math.min(1,(now-flyT.t0)/flyT.dur),e=reduce?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);controls.target.lerpVectors(flyT.ft,flyT.tt,e);camera.position.lerpVectors(flyT.fp,flyT.tp,e);if(t>=1||reduce)flyT=null;}
  controls.update();sun.target.position.copy(controls.target);sun.position.set(controls.target.x-24,controls.target.y+58,controls.target.z+32);
  renderer.render(scene,camera);placeLabels();requestAnimationFrame(tick);}
function applyTheme(){const c=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--scene").trim()||"#e7ecf3");renderer.setClearColor(c);ground.material.color.copy(c);}
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

// mở từ trang chủ: ?to=<tầng>-<số phòng> chỉ đường luôn, ?q=<chữ> tìm sẵn
