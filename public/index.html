<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c5d3cb">
<!-- Trang chỉ đường cho người bệnh. Dữ liệu đọc từ map_data.json cùng thư mục. Không cần sửa file này khi đổi khoa, thêm tòa hay thêm đường. -->
<title>Bản đồ Bệnh viện Sản Nhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<style>
/* Layout: bản đồ 3D toàn màn hình; khung tìm kiếm phía trên; bảng chỉ dẫn ở đáy (điện thoại) hoặc cột trái (máy tính) */
:root{
  --bg:#c5d3cb; --ground:#d3dfd0; --path:#efe9df; --road:#a7a4a0; --road-line:#efe9df;
  --panel:#fbfbf8; --fg:#24252a; --muted:#62606a; --line:#d9d6cf; --hover:#eef2ee;
  --clinic:#d9bfc1; --support:#cfc9c2; --park:#bfcfc4; --emergency:#c6453c;
  --accent:#2f6f73; --roof:#efe7e4; --door:#d2342a;
  --route:#d4372c; --start:#1f63b0;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181b; --ground:#202327; --path:#2f3338; --road:#3a3d42; --road-line:#5b5f66;
  --panel:#1f2226; --fg:#ece8e6; --muted:#a6a2a6; --line:#363a40; --hover:#2a2e33;
  --clinic:#8f6f73; --support:#6e6a66; --park:#5d7364; --emergency:#d0584e;
  --accent:#6fb3b7; --roof:#a88d90; --door:#ff6a5c;
  --route:#ff6b5e; --start:#6eaeff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16181b; --ground:#202327; --path:#2f3338; --road:#3a3d42; --road-line:#5b5f66;
  --panel:#1f2226; --fg:#ece8e6; --muted:#a6a2a6; --line:#363a40; --hover:#2a2e33;
  --clinic:#8f6f73; --support:#6e6a66; --park:#5d7364; --emergency:#d0584e;
  --accent:#6fb3b7; --roof:#a88d90; --door:#ff6a5c;
  --route:#ff6b5e; --start:#6eaeff; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#app{position:relative;height:100%;width:100%}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.10)}

#panel{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));width:min(400px,calc(100% - 32px));max-height:calc(100% - 24px);display:flex;flex-direction:column;gap:8px;z-index:5}
.search{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.start{font-size:13px;color:var(--muted)}
.start .pin{width:12px;height:12px;border-radius:50%;background:var(--start);box-shadow:0 0 0 3px color-mix(in srgb,var(--start) 25%,transparent);flex:none}
.start label{white-space:nowrap}
#startSel{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:600;color:var(--fg);background:transparent;border:none;padding:4px 0;text-overflow:ellipsis}
.find{border-top:1px solid var(--line);padding-top:8px}
.find svg{flex:none;color:var(--route)}
#q{flex:1;min-width:0;font:inherit;font-size:16px;border:none;background:transparent;color:var(--fg);padding:6px 0}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button{display:none}
#clearQ{border:none;background:none;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--hover);border-radius:999px;padding:6px 12px}
.chips button.em{color:var(--emergency);border-color:color-mix(in srgb,var(--emergency) 45%,var(--line))}

#results{overflow:auto;max-height:min(55vh,460px);padding:4px}
#results button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:10px 12px}
#results button:hover,#results button.on{background:var(--hover)}
#results .t{font-size:15px;font-weight:600}
#results .s{font-size:13px;color:var(--muted)}
#results .empty{padding:14px 12px;font-size:14px;color:var(--muted);line-height:1.5}

#sheet{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#sheet header{padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#sTitle{margin:0;font-size:18px;line-height:1.3;text-wrap:balance}
#sSub{font-size:14px;color:var(--muted)}
#sSum{font-size:15px;font-weight:600;color:var(--route);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.actions button{font-size:13px;font-weight:500;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px}
.actions button.primary{background:var(--route);border-color:var(--route);color:#fff;font-weight:600}
#sBody{overflow:auto;min-height:0}
#sheet[data-collapsed="true"] #sBody{display:none}
ol.steps{list-style:none;margin:0;padding:6px 8px 12px}
ol.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 8px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:none}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--fg)}
.ic.go{background:color-mix(in srgb,var(--start) 16%,transparent);color:var(--start)}
.ic.end,.ic.floor{background:color-mix(in srgb,var(--route) 16%,transparent);color:var(--route)}
ol.steps .tx{font-size:16px;line-height:1.45;padding-top:5px}
ol.steps .tx b{font-weight:600}
.floors{padding:8px 16px 14px;display:flex;flex-direction:column;gap:10px}
.floors .fl{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;line-height:1.45}
.floors .fl span:first-child{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.floors p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}

#views{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:4}
#views button{background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--panel);border:1px solid var(--line);pointer-events:auto;cursor:pointer}
.lb.big{font-size:14px;font-weight:700}
.lb.small{font-size:10.5px;font-weight:500;color:var(--muted)}
.lb.text{background:none;border:none;font-size:11px;color:var(--muted);font-weight:500;pointer-events:none}
.lb.on{background:var(--route);border-color:var(--route);color:#fff}
.lb.you{background:var(--start);border-color:var(--start);color:#fff;font-size:13px;pointer-events:none;z-index:2}
.lb.dest{background:var(--route);border-color:var(--route);color:#fff;font-size:13px;pointer-events:none;z-index:2}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--fg);color:var(--panel);font-size:14px;padding:10px 14px;border-radius:10px;z-index:20;text-align:center}

#qrView{position:absolute;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#qrView h1{font-size:20px;margin:0 0 4px}
#qrView p{margin:0 0 16px;color:var(--muted);font-size:14px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qrgrid .card{padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:none}
.qrgrid .qr{background:#fff;padding:8px;border-radius:6px}
.qrhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.qrhead p{max-width:70ch;line-height:1.55}
.qrhead .back,.qrgrid .test{font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
.dirs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%}
.dirs button{border:1px solid var(--line);background:none;border-radius:6px;padding:5px 0;font-size:15px;line-height:1}
.dirs button[aria-pressed="true"]{background:var(--start);border-color:var(--start);color:#fff}
.qrgrid b{font-size:14px}.qrgrid code{font-size:11px;color:var(--muted);word-break:break-all}

#pickPanel{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;padding:12px 14px;z-index:25;font-size:13px}
#pickPanel .ph{display:flex;justify-content:space-between;align-items:center;font-size:15px}
#pickPanel p{margin:8px 0;color:var(--muted);line-height:1.5}
#pickPanel .pr{display:grid;grid-template-columns:74px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#pickPanel .k{color:var(--muted);font-size:12px}
#pickPanel code{font-size:12px;word-break:break-all;user-select:all}
#pickPanel button{font-size:12px;border:1px solid var(--line);background:none;border-radius:6px;padding:4px 8px}
#pickPanel .ok{color:var(--accent);font-weight:600}#pickPanel .bad{color:var(--route);font-weight:600}
#pickPanel ul{margin:4px 0 0;padding-left:18px;line-height:1.5}
.lb.nid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:500;padding:1px 4px;background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg)}
.previewBadge{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:22;background:#a86a12;color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;pointer-events:none}
@media (max-width:720px){
  #panel{width:auto;right:max(16px,env(safe-area-inset-right,0px));max-height:none}
  #sheet{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:48%}
  #panel.routing .chips{display:none}
  #views{top:auto;bottom:calc(50% + 10px);transform:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="app">
  <div id="labels"></div>
  <div id="panel">
    <div class="card search">
      <div class="row start">
        <span class="pin" aria-hidden="true"></span>
        <label for="startSel">Bạn đang ở</label>
        <select id="startSel"></select>
      </div>
      <div class="row find">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Tìm khoa, phòng hoặc tòa nhà…" autocomplete="off" enterkeyhint="search" aria-label="Tìm điểm đến">
        <button id="clearQ" aria-label="Xóa ô tìm kiếm" hidden>×</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card" id="results" hidden role="listbox" aria-label="Kết quả tìm kiếm"></div>
    <section class="card" id="sheet" hidden aria-live="polite">
      <header>
        <div class="eyebrow" id="sEyebrow"></div>
        <h2 id="sTitle"></h2>
        <div id="sSub"></div>
        <div id="sSum"></div>
        <div class="actions" id="sActions"></div>
      </header>
      <div id="sBody"></div>
    </section>
  </div>
  <div id="views" role="group" aria-label="Góc nhìn">
    <button id="vTilt" aria-pressed="true">3D</button>
    <button id="vTop" aria-pressed="false">Từ trên</button>
    <button id="vAll">Toàn cảnh</button>
    <button id="vCompass" aria-pressed="false">La bàn</button>
  </div>
  <div id="toast" hidden role="status"></div>
  <div id="qrView" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
"use strict";
// ================= NẠP DỮ LIỆU CHUNG (map_data.json) =================
let D;
let PREVIEW=false;
try{
  // Bản xem thử từ trang quản trị (chưa lưu): ?preview=1
  if(/[?&]preview=1/.test(location.search)){try{const t=localStorage.getItem("mapEditor.preview");if(t){D=JSON.parse(t);PREVIEW=true;}}catch(e){}}
  if(!D){const r=await fetch("map_data.json",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);D=await r.json();}
}
catch(e){document.getElementById("app").innerHTML='<div style="padding:24px;font:16px/1.5 system-ui">Không tải được dữ liệu bản đồ (map_data.json). Vui lòng tải lại trang.<br><small>'+String(e)+'</small></div>';return;}
// ================= CẤU HÌNH =================
const DOMAIN = D.config.domain;
const LOG_URL = D.config.logUrl;
const M_PER_PX = D.config.metersPerPixel;   // 1 pixel sơ đồ ≈ bao nhiêu mét
const WALK_MPS = D.config.walkingSpeed;     // tốc độ đi bộ, m/giây
const MAP_UP_BEARING = D.config.mapUpBearing; // hướng la bàn của "phía trên" sơ đồ
const GATE_FACING = D.gateFacing||{};
const OLD_IDS = D.oldIds||{};
const PROBLEMS=[]; // lỗi dữ liệu, hiện ở chế độ #toado

// ================= ĐIỂM (NODE) =================
// type: gate = cổng, door = cửa tòa nhà, jct = ngã rẽ. lm = tên mốc dùng trong câu chỉ dẫn.
const N={};
(D.nodes||[]).forEach(n=>{
  if(N[n.id]) PROBLEMS.push(`Mã điểm "${n.id}" bị trùng.`);
  const t=n.type==="junction"?"jct":n.type;
  if(!["gate","door","jct"].includes(t)) PROBLEMS.push(`Điểm "${n.id}" có type "${n.type}" không hợp lệ (gate / door / junction).`);
  N[n.id]={id:n.id,x:+n.x,y:+n.y,type:t,name:n.name||n.landmark||n.id,lm:n.landmark||n.name||n.id};
});
// ================= ĐOẠN ĐƯỜNG (EDGE) =================
// Mỗi mục trong "edges" là một chuỗi điểm nối liền ("path"), cùng thuộc tính.
const E=[];
(D.edges||[]).forEach((e,i)=>{
  const path=e.path||[e.a,e.b];
  for(let k=0;k<path.length-1;k++){
    const a=path[k],b=path[k+1];
    if(!N[a]||!N[b]){PROBLEMS.push(`Đường thứ ${i+1}: không có điểm "${!N[a]?a:b}".`);continue;}
    E.push({a,b,w:e.width,cov:e.covered?1:0,canopy:e.canopy===false?0:1,indoor:e.indoor||null});
  }
});
// ================= ĐIỂM ĐẾN VÀ KHOA PHÒNG =================
const PLACES=(D.places||[]).map(p=>({id:p.id,name:p.name,bld:p.building||null,doors:(p.doors||[]).filter(d=>{if(!N[d])PROBLEMS.push(`Điểm đến "${p.id}": không có cửa "${d}".`);return !!N[d];}),
  depts:(p.departments||[]).map(d=>({f:d.floor==null?null:+d.floor,n:d.name,a:d.keywords||""})),a:p.keywords||"",note:p.note||""}));
const PLACE_BY_ID={};PLACES.forEach(p=>PLACE_BY_ID[p.id]=p);
const PLACE_BY_BLD={};(D.buildings||[]).forEach(b=>{if(b.place){if(PLACE_BY_ID[b.place])PLACE_BY_BLD[b.id]=b.place;else PROBLEMS.push(`Khối nhà "${b.id}": không có điểm đến "${b.place}".`);}});
const QUICK=(D.quickSearches||[]).map(q=>[q.label,q.query,q.emergency?1:0]);

// ================= THUẬT TOÁN =================
const ADJ={};Object.keys(N).forEach(k=>ADJ[k]=[]);
E.forEach(e=>{
  const A=N[e.a],B=N[e.b]; if(!A||!B){console.warn("Thiếu điểm",e);return;}
  e.len=Math.hypot(A.x-B.x,A.y-B.y);
  // chi phí: đi trong nhà hơi bất tiện, hành lang mái che được ưu tiên nhẹ
  e.cost=e.len*(e.indoor?1.15:e.cov?0.95:1);
  ADJ[e.a].push({to:e.b,e});ADJ[e.b].push({to:e.a,e});
});
function dijkstra(src){
  const dist={},prev={},done=new Set();
  Object.keys(N).forEach(k=>dist[k]=Infinity);dist[src]=0;
  for(;;){
    let u=null,best=Infinity;
    for(const k in dist) if(!done.has(k)&&dist[k]<best){best=dist[k];u=k;}
    if(u===null) break; // các điểm còn lại không tới được
    done.add(u);
    for(const {to,e} of ADJ[u]){const d=best+e.cost;if(d<dist[to]){dist[to]=d;prev[to]={from:u,e};}}
  }
  return {dist,prev};
}
function pathTo(res,src,dst){
  if(!isFinite(res.dist[dst])) return null;
  const ids=[dst],edges=[];let c=dst;
  while(c!==src){const p=res.prev[c];edges.unshift(p.e);ids.unshift(p.from);c=p.from;}
  return {ids,edges};
}
function meters(px){return px*M_PER_PX;}
function fmtM(m){return Math.max(5,Math.round(m/5)*5)+" m";}
function turnAt(a,b,c){
  // cùng quy ước với bản Flutter: trục y hướng xuống, góc dương = rẽ phải
  const a1=Math.atan2(b.y-a.y,b.x-a.x),a2=Math.atan2(c.y-b.y,c.x-b.x);
  let d=(a2-a1)*180/Math.PI;while(d<=-180)d+=360;while(d>180)d-=360;
  if(d>25&&d<155) return "right"; if(d<-25&&d>-155) return "left"; if(Math.abs(d)>=155) return "back"; return null;
}
function buildSteps(route,place,dept,facing,fsrc){
  const ids=route.ids,steps=[],total=route.edges.reduce((s,e)=>s+meters(e.len),0);
  steps.push({ic:"go",t:`Bạn đang ở <b>${N[ids[0]].name}</b>`});
  if(route.edges.length&&facing!=null){
    const a=N[ids[0]],b=N[ids[1]],tgt=b.type==="jct"?b.lm:b.name;
    let d=Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI-facing;while(d<=-180)d+=360;while(d>180)d-=360;
    if(Math.abs(d)>145) steps.push({ic:"back",t:`<b>${fsrc==="compass"?"Quay người ra phía sau":"Quay lưng lại tấm biển QR"}</b>, hướng về ${tgt}`});
    else if(d>=35) steps.push({ic:"right",t:`<b>Quay người sang phải</b>, hướng về ${tgt}`});
    else if(d<=-35) steps.push({ic:"left",t:`<b>Quay người sang trái</b>, hướng về ${tgt}`});
    else steps.push({ic:"straight",t:`<b>Đi thẳng về phía trước</b>, hướng về ${tgt}`});
  }
  if(ids.length===1){ steps.push({ic:"end",t:`Bạn đang đứng ngay <b>${N[ids[0]].name}</b>`}); }
  const kind=e=>e.indoor?"in":e.cov?"cov":"out";
  let acc=0;
  for(let k=0;k<route.edges.length;k++){
    const e=route.edges[k];acc+=meters(e.len);
    const lead=kind(e)==="in"?`Đi xuyên qua ${e.indoor} khoảng <b>${fmtM(acc)}</b>`:
               kind(e)==="cov"?`Đi theo hành lang có mái che khoảng <b>${fmtM(acc)}</b>`:`Đi thẳng khoảng <b>${fmtM(acc)}</b>`;
    const at=N[ids[k+1]];
    if(k===route.edges.length-1){ steps.push({ic:"end",t:`${lead} là tới <b>${at.name}</b>`}); break; }
    const t=turnAt(N[ids[k]],at,N[ids[k+2]]);
    if(t){
      const word=t==="right"?"rẽ phải":t==="left"?"rẽ trái":"quay ngược lại";
      steps.push({ic:t,t:`${lead}, rồi <b>${word}</b> ở ${at.lm}`});acc=0;
    }else if(kind(route.edges[k+1])!==kind(e)){
      steps.push({ic:"straight",t:`${lead} tới ${at.type==="jct"?at.lm:"<b>"+at.name+"</b>"}`});acc=0;
    }
  }
  if(dept){
    if(dept.f===1) steps.push({ic:"floor",t:`<b>${dept.n}</b> ở ngay <b>Tầng 1</b>, vào cửa là tới`});
    else if(dept.f) steps.push({ic:"floor",t:`Vào tòa, lên <b>Tầng ${dept.f}</b> bằng thang máy hoặc cầu thang bộ để tới <b>${dept.n}</b>`});
    else steps.push({ic:"floor",t:`Vào tòa, hỏi quầy hướng dẫn để tới <b>${dept.n}</b>`});
  }
  return {steps,total};
}

const INDEX=[];

function search(q){
  const nq=norm(q); if(!nq) return [];
  const toks=nq.split(" ");

    .map(it=>{const nt=norm(it.t);return {it,r:nt.startsWith(nq)?0:nt.includes(nq)?1:(it.d?2:3)};})
    .sort((a,b)=>a.r-b.r||(a.it.d?0:1)-(b.it.d?0:1)).slice(0,40).map(x=>x.it);
}

const compass={on:false,follow:false,got:false,heading:null,lastUsed:null,lastT:0};

function onOrient(e){
  let hd=null;
  if(typeof e.webkitCompassHeading==="number"&&e.webkitCompassHeading>=0){hd=e.webkitCompassHeading;
    if(e.webkitCompassAccuracy>35&&!compass.warned){compass.warned=1;toast("La bàn đang kém chính xác. Hãy cầm máy nằm ngang và xoay cổ tay theo hình số 8 vài lần.",6000);}}
  else if(e.absolute&&e.alpha!=null) hd=360-e.alpha;
  if(hd==null) return;
  hd=(hd+((screen.orientation&&screen.orientation.angle)||0)+360)%360;
  compass.got=true;
  const mf=((hd-MAP_UP_BEARING)%360+360)%360;
  if(compass.heading==null) compass.heading=mf;
  else{let d=mf-compass.heading;while(d>180)d-=360;while(d<-180)d+=360;compass.heading=(compass.heading+d*.2+360)%360;}
  facing=compass.heading;facingSrc="compass";updateBeam();
  const now=performance.now();
  if(current&&now-compass.lastT>1200){let d=Math.abs(facing-(compass.lastUsed??facing+99));if(d>180)d=360-d;
    if(d>25){compass.lastUsed=facing;compass.lastT=now;showRoute(current.place,current.dept,true);}}
}

  if(typeof DeviceOrientationEvent==="undefined"){toast("Máy hoặc trình duyệt này không có la bàn. Bản đồ vẫn xoay theo hướng của tấm biển QR.",5000);return;}
  compass.on=compass.follow=true;compass.got=false;compass.heading=null;compass.lastUsed=null;vC.setAttribute("aria-pressed","true");
  if("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute",onOrient);
  else addEventListener("deviceorientation",onOrient);
  setTimeout(()=>{if(compass.on&&!compass.got){stopCompass();toast("Máy hoặc trình duyệt này không gửi dữ liệu la bàn. Bản đồ vẫn xoay theo hướng của tấm biển QR.",5000);}},3000);
}
