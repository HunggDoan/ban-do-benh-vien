<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5fa">
<!-- Trang chỉ đường cho người bệnh. Dữ liệu đọc từ map_data.json cùng thư mục. Không cần sửa file này khi đổi khoa, thêm tòa hay thêm đường. -->
<title>Bản đồ Bệnh viện Sản Nhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<style>
/* Layout: bản đồ 3D toàn màn hình; khung tìm kiếm phía trên; bảng chỉ dẫn ở đáy (điện thoại) hoặc cột trái (máy tính) */
:root{
  --bg:#c5d3cb; --ground:#d3dfd0; --path:#efe9df; --road:#a7a4a0; --road-line:#efe9df;
  --panel:#fbfbf8; --fg:#24252a; --muted:#62606a; --line:#d9d6cf; --hover:#eef2ee;
  --clinic:#d9bfc1; --support:#cfc9c2; --park:#bfcfc4; --emergency:#c6453c;
  --accent:#2f6f73; --roof:#efe7e4; --door:#d2342a;
  --route:#d4372c; --start:#1f63b0;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181b; --ground:#202327; --path:#2f3338; --road:#3a3d42; --road-line:#5b5f66;
  --panel:#1f2226; --fg:#ece8e6; --muted:#a6a2a6; --line:#363a40; --hover:#2a2e33;
  --clinic:#8f6f73; --support:#6e6a66; --park:#5d7364; --emergency:#d0584e;
  --accent:#6fb3b7; --roof:#a88d90; --door:#ff6a5c;
  --route:#ff6b5e; --start:#6eaeff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16181b; --ground:#202327; --path:#2f3338; --road:#3a3d42; --road-line:#5b5f66;
  --panel:#1f2226; --fg:#ece8e6; --muted:#a6a2a6; --line:#363a40; --hover:#2a2e33;
  --clinic:#8f6f73; --support:#6e6a66; --park:#5d7364; --emergency:#d0584e;
  --accent:#6fb3b7; --roof:#a88d90; --door:#ff6a5c;
  --route:#ff6b5e; --start:#6eaeff; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#app{position:relative;height:100%;width:100%}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.10)}

#panel{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));width:min(400px,calc(100% - 32px));max-height:calc(100% - 24px);display:flex;flex-direction:column;gap:8px;z-index:5}
.search{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.start{font-size:13px;color:var(--muted)}
.start .pin{width:12px;height:12px;border-radius:50%;background:var(--start);box-shadow:0 0 0 3px color-mix(in srgb,var(--start) 25%,transparent);flex:none}
.start label{white-space:nowrap}
#startSel{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:600;color:var(--fg);background:transparent;border:none;padding:4px 0;text-overflow:ellipsis}
.find{border-top:1px solid var(--line);padding-top:8px}
.find svg{flex:none;color:var(--route)}
#q{flex:1;min-width:0;font:inherit;font-size:16px;border:none;background:transparent;color:var(--fg);padding:6px 0}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button{display:none}
#clearQ{border:none;background:none;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--hover);border-radius:999px;padding:6px 12px}
.chips button.em{color:var(--emergency);border-color:color-mix(in srgb,var(--emergency) 45%,var(--line))}

#results{overflow:auto;max-height:min(55vh,460px);padding:4px}
#results button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:10px 12px}
#results button:hover,#results button.on{background:var(--hover)}
#results .t{font-size:15px;font-weight:600}
#results .s{font-size:13px;color:var(--muted)}
#results .empty{padding:14px 12px;font-size:14px;color:var(--muted);line-height:1.5}

#sheet{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#sheet header{padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#sTitle{margin:0;font-size:18px;line-height:1.3;text-wrap:balance}
#sSub{font-size:14px;color:var(--muted)}
#sSum{font-size:15px;font-weight:600;color:var(--route);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.actions button{font-size:13px;font-weight:500;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px}
.actions button.primary{background:var(--route);border-color:var(--route);color:#fff;font-weight:600}
#sBody{overflow:auto;min-height:0}
#sheet[data-collapsed="true"] #sBody{display:none}
ol.steps{list-style:none;margin:0;padding:6px 8px 12px}
ol.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 8px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:none}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--fg)}
.ic.go{background:color-mix(in srgb,var(--start) 16%,transparent);color:var(--start)}
.ic.end,.ic.floor{background:color-mix(in srgb,var(--route) 16%,transparent);color:var(--route)}
ol.steps .tx{font-size:16px;line-height:1.45;padding-top:5px}
ol.steps .tx b{font-weight:600}
.floors{padding:8px 16px 14px;display:flex;flex-direction:column;gap:10px}
.floors .fl{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;line-height:1.45}
.floors .fl span:first-child{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.floors p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}

#views{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:4}
#views button{background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--panel);border:1px solid var(--line);pointer-events:auto;cursor:pointer}
.lb.big{font-size:14px;font-weight:700}
.lb.small{font-size:10.5px;font-weight:500;color:var(--muted)}
.lb.text{background:none;border:none;font-size:11px;color:var(--muted);font-weight:500;pointer-events:none}
.lb.on{background:var(--route);border-color:var(--route);color:#fff}
.lb.you{background:var(--start);border-color:var(--start);color:#fff;font-size:13px;pointer-events:none;z-index:2}
.lb.dest{background:var(--route);border-color:var(--route);color:#fff;font-size:13px;pointer-events:none;z-index:2}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--fg);color:var(--panel);font-size:14px;padding:10px 14px;border-radius:10px;z-index:20;text-align:center}

#qrView{position:absolute;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#qrView h1{font-size:20px;margin:0 0 4px}
#qrView p{margin:0 0 16px;color:var(--muted);font-size:14px}
#qrView h2.qrsec{font-size:16px;margin:22px 0 10px}
#qrView a.test{display:block;text-decoration:none}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qrgrid .card{padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:none}
.qrgrid .qr{background:#fff;padding:8px;border-radius:6px}
.qrhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.qrhead p{max-width:70ch;line-height:1.55}
.qrhead .back,.qrgrid .test{font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
.dirs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%}
.dirs button{border:1px solid var(--line);background:none;border-radius:6px;padding:5px 0;font-size:15px;line-height:1}
.dirs button[aria-pressed="true"]{background:var(--start);border-color:var(--start);color:#fff}
.qrgrid b{font-size:14px}.qrgrid code{font-size:11px;color:var(--muted);word-break:break-all}

#pickPanel{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;padding:12px 14px;z-index:25;font-size:13px}
#pickPanel .ph{display:flex;justify-content:space-between;align-items:center;font-size:15px}
#pickPanel p{margin:8px 0;color:var(--muted);line-height:1.5}
#pickPanel .pr{display:grid;grid-template-columns:74px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#pickPanel .k{color:var(--muted);font-size:12px}
#pickPanel code{font-size:12px;word-break:break-all;user-select:all}
#pickPanel button{font-size:12px;border:1px solid var(--line);background:none;border-radius:6px;padding:4px 8px}
#pickPanel .ok{color:var(--accent);font-weight:600}#pickPanel .bad{color:var(--route);font-weight:600}
#pickPanel ul{margin:4px 0 0;padding-left:18px;line-height:1.5}
.lb.nid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:500;padding:1px 4px;background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg)}
.previewBadge{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:22;background:#a86a12;color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;pointer-events:none}
@media (max-width:720px){
  #panel{width:auto;right:max(16px,env(safe-area-inset-right,0px));max-height:none}
  #sheet{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:48%}
  #panel.routing .chips{display:none}
  #views{top:auto;bottom:calc(50% + 10px);transform:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* ================= TRANG CHỦ KIỂU ỨNG DỤNG =================
   Lớp phủ #home nằm trên bản đồ; thanh #tabbar luôn ở đáy; các trang phụ (#page) và máy quét QR (#scan) phủ toàn màn hình. */
:root{--pri:#1b5cff;--pri-2:#0f46d8;--pri-soft:#e8efff;--h-bg:#f2f5fa;--h-card:#ffffff;--h-ink:#0f1b2d;--h-mute:#5b6b82;--h-line:#e3e8f0;--tab-h:66px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri-soft:#1d2b4a;--h-bg:#0e1420;--h-card:#161e2c;--h-ink:#e8eef8;--h-mute:#94a3ba;--h-line:#263247}}
:root[data-theme="dark"]{--pri-soft:#1d2b4a;--h-bg:#0e1420;--h-card:#161e2c;--h-ink:#e8eef8;--h-mute:#94a3ba;--h-line:#263247}
#home,#page{position:absolute;inset:0;z-index:10;background:var(--h-bg);color:var(--h-ink);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
#page{z-index:11}
.hwrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hhead{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:10px}
.hlogo{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.hlogo img{width:100%;height:100%;object-fit:contain;background:#fff}
.hname{flex:1;min-width:0}
.hname b{display:block;font-size:16.5px;line-height:1.25;font-weight:700}
.hname small{display:block;font-size:12px;color:var(--h-mute);margin-top:1px}
.hbell{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:var(--h-card);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(15,27,45,.06)}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#e5484d;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--h-card)}
.hhero{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(140deg,var(--pri) 0%,var(--pri-2) 100%);color:#fff;padding:18px 14px 14px;box-shadow:0 10px 28px color-mix(in srgb,var(--pri) 30%,transparent)}
.hhero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hhero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--pri) 78%,transparent),color-mix(in srgb,var(--pri-2) 92%,transparent))}
.hhero .top{position:relative;display:flex;gap:8px;align-items:flex-end;min-height:128px}
.hhero .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:0 0 6px 4px;align-self:stretch}
.hhero h2{margin:0;font-size:22px;line-height:1.22;font-weight:700;text-wrap:balance}
.hhero p{margin:0;font-size:12.5px;opacity:.9}
.hhero .go{margin-top:auto;align-self:flex-start;border:0;background:#fff;color:var(--pri);font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;display:inline-flex;gap:6px;align-items:center}
.hhero .im{width:46%;max-width:210px;flex:none;align-self:flex-end;margin-right:-4px}
.hhero .im img{width:100%;height:auto;max-height:140px;object-fit:contain;display:block}
.hhero .im svg{width:100%;height:auto;display:block}
.hsearch{position:relative;margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--h-card);border-radius:14px;padding:0 6px 0 14px;height:52px;color:var(--h-mute);box-shadow:0 6px 18px rgba(5,20,60,.18)}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--h-ink);height:100%}
.hsearch input::placeholder{color:var(--h-mute)}
.hsearch button{width:38px;height:38px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--h-mute);flex:none}
.hsearch:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,#fff 55%,transparent),0 6px 18px rgba(5,20,60,.18)}
.hres{margin-top:10px;background:var(--h-card);border-radius:16px;box-shadow:0 8px 24px rgba(15,27,45,.10);overflow:hidden}
.hres .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:12px;color:var(--h-mute);font-weight:600}
.hres button.it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;border-top:1px solid var(--h-line);text-align:left;color:var(--h-ink)}
.hres button.it:first-of-type{border-top:0}
.hres button.it:active{background:var(--pri-soft)}
.hres i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--pri-soft);color:var(--pri)}
.hres i svg{width:19px;height:19px}
.hres span.t{flex:1;min-width:0}
.hres b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.hres small{display:block;font-size:12px;color:var(--h-mute);margin-top:2px}
.hres .tagF{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#fff1e6;color:#c2410c;margin-right:4px;vertical-align:1px}
.hres .empty{padding:14px;font-size:13.5px;color:var(--h-mute);line-height:1.5}
.hloc{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--pri-soft);border:0;width:100%;text-align:left}
.hloc i{width:12px;height:12px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent);flex:none}
.hloc span{flex:1;min-width:0;font-size:13px;color:var(--h-ink)}
.hloc span small{display:block;color:var(--h-mute);font-size:11.5px}
.hloc span b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hloc em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--pri)}
/* chọn bản đồ */
.mapcard{display:block;width:100%;border:0;padding:0;margin-top:14px;background:var(--h-card);border-radius:18px;overflow:hidden;text-align:left;color:var(--h-ink);box-shadow:0 4px 16px rgba(15,27,45,.08)}
.mapcard .pic{height:150px;background:var(--pri-soft);display:block}
.mapcard .pic img,.mapcard .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.mapcard .row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mapcard .row>span:first-child{flex:1;min-width:0}
.mapcard b{display:block;font-size:16px;font-weight:700}
.mapcard small{display:block;font-size:12.5px;color:var(--h-mute);margin-top:2px}
.mapcard .go{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.hsec{margin-top:16px;background:var(--h-card);border-radius:18px;padding:14px 14px 10px;box-shadow:0 2px 10px rgba(15,27,45,.05)}
.hsec h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.hsec h3 button{border:0;background:none;color:var(--pri);font-size:13px;font-weight:600;padding:4px 0}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px}
.htile{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:2px;font-size:12px;line-height:1.3;text-align:center;color:var(--h-ink)}
.htile i{width:54px;height:54px;border-radius:16px;display:grid;place-items:center}
.htile i svg{width:26px;height:26px}
.hlist button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 0;border-top:1px solid var(--h-line);text-align:left;color:var(--h-ink)}
.hlist button:first-child{border-top:0}
.hlist i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.hlist i svg{width:21px;height:21px}
.hlist span{flex:1;min-width:0}
.hlist b{display:block;font-size:14.5px;font-weight:600}
.hlist small{display:block;font-size:12.5px;color:var(--h-mute);margin-top:1px}
.hlist .chev{color:var(--h-mute);flex:none}
.hfoot{margin-top:16px;font-size:11.5px;color:var(--h-mute);text-align:center}
/* trang phụ */
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--h-bg);padding-top:12px;padding-bottom:10px}
.phead h2{flex:1;margin:0;font-size:17px;text-align:center}
.pback{width:40px;height:40px;border-radius:12px;border:0;background:var(--h-card);display:grid;place-items:center;flex:none}
.pcard{background:var(--h-card);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(15,27,45,.05)}

<script>
(async function(){
"use strict";
// ================= NẠP DỮ LIỆU CHUNG (map_data.json) =================
let D;
let PREVIEW=false;
try{
  // Bản xem thử từ trang quản trị (chưa lưu): ?preview=1
  if(/[?&]preview=1/.test(location.search)){try{const t=localStorage.getItem("mapEditor.preview");if(t){D=JSON.parse(t);PREVIEW=true;}}catch(e){}}
  if(!D){const r=await fetch("map_data.json",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);D=await r.json();}
}
catch(e){document.getElementById("app").innerHTML='<div style="padding:24px;font:16px/1.5 system-ui">Không tải được dữ liệu bản đồ (map_data.json). Vui lòng tải lại trang.<br><small>'+String(e)+'</small></div>';return;}
// ================= CẤU HÌNH =================
const DOMAIN = String(D.config.domain||location.origin).replace(/\/+$/,""); // tên miền in trên mã QR, sửa ở trang quản trị → Khác
const LOG_URL = D.config.logUrl;
const M_PER_PX = D.config.metersPerPixel;   // 1 pixel sơ đồ ≈ bao nhiêu mét
const WALK_MPS = D.config.walkingSpeed;     // tốc độ đi bộ, m/giây
const MAP_UP_BEARING = D.config.mapUpBearing; // hướng la bàn của "phía trên" sơ đồ
const GATE_FACING = D.gateFacing||{};
const OLD_IDS = D.oldIds||{};
const PROBLEMS=[]; // lỗi dữ liệu, hiện ở chế độ #toado

// ================= ĐIỂM (NODE) =================
// type: gate = cổng, door = cửa tòa nhà, jct = ngã rẽ. lm = tên mốc dùng trong câu chỉ dẫn.
const N={};
(D.nodes||[]).forEach(n=>{
  if(N[n.id]) PROBLEMS.push(`Mã điểm "${n.id}" bị trùng.`);
  const t=n.type==="junction"?"jct":n.type;
  if(!["gate","door","jct"].includes(t)) PROBLEMS.push(`Điểm "${n.id}" có type "${n.type}" không hợp lệ (gate / door / junction).`);
  N[n.id]={id:n.id,x:+n.x,y:+n.y,type:t,name:n.name||n.landmark||n.id,lm:n.landmark||n.name||n.id};
});
// ================= ĐOẠN ĐƯỜNG (EDGE) =================
// Mỗi mục trong "edges" là một chuỗi điểm nối liền ("path"), cùng thuộc tính.
const E=[];
(D.edges||[]).forEach((e,i)=>{
  const path=e.path||[e.a,e.b];
  for(let k=0;k<path.length-1;k++){
    const a=path[k],b=path[k+1];
    if(!N[a]||!N[b]){PROBLEMS.push(`Đường thứ ${i+1}: không có điểm "${!N[a]?a:b}".`);continue;}
    E.push({a,b,w:e.width,cov:e.covered?1:0,canopy:e.canopy===false?0:1,indoor:e.indoor||null});
  }
});
// ================= ĐIỂM ĐẾN VÀ KHOA PHÒNG =================
const PLACES=(D.places||[]).map(p=>({id:p.id,name:p.name,bld:p.building||null,doors:(p.doors||[]).filter(d=>{if(!N[d])PROBLEMS.push(`Điểm đến "${p.id}": không có cửa "${d}".`);return !!N[d];}),
  depts:(p.departments||[]).map(d=>({f:d.floor==null?null:+d.floor,n:d.name,a:d.keywords||""})),a:p.keywords||"",note:p.note||""}));
const PLACE_BY_ID={};PLACES.forEach(p=>PLACE_BY_ID[p.id]=p);
const PLACE_BY_BLD={};(D.buildings||[]).forEach(b=>{if(b.place){if(PLACE_BY_ID[b.place])PLACE_BY_BLD[b.id]=b.place;else PROBLEMS.push(`Khối nhà "${b.id}": không có điểm đến "${b.place}".`);}});
const QUICK=(D.quickSearches||[]).map(q=>[q.label,q.query,q.emergency?1:0]);

// ================= THUẬT TOÁN =================
const ADJ={};Object.keys(N).forEach(k=>ADJ[k]=[]);
E.forEach(e=>{
  const A=N[e.a],B=N[e.b]; if(!A||!B){console.warn("Thiếu điểm",e);return;}
  e.len=Math.hypot(A.x-B.x,A.y-B.y);
  // chi phí: đi trong nhà hơi bất tiện, hành lang mái che được ưu tiên nhẹ
  e.cost=e.len*(e.indoor?1.15:e.cov?0.95:1);
  ADJ[e.a].push({to:e.b,e});ADJ[e.b].push({to:e.a,e});
});
function dijkstra(src){
  const dist={},prev={},done=new Set();
  Object.keys(N).forEach(k=>dist[k]=Infinity);dist[src]=0;
  for(;;){
    let u=null,best=Infinity;
    for(const k in dist) if(!done.has(k)&&dist[k]<best){best=dist[k];u=k;}
    if(u===null) break; // các điểm còn lại không tới được
    done.add(u);
    for(const {to,e} of ADJ[u]){const d=best+e.cost;if(d<dist[to]){dist[to]=d;prev[to]={from:u,e};}}
  }
  return {dist,prev};
}
function pathTo(res,src,dst){
  if(!isFinite(res.dist[dst])) return null;
  const ids=[dst],edges=[];let c=dst;
  while(c!==src){const p=res.prev[c];edges.unshift(p.e);ids.unshift(p.from);c=p.from;}
  return {ids,edges};
}
function meters(px){return px*M_PER_PX;}
function fmtM(m){return Math.max(5,Math.round(m/5)*5)+" m";}
function turnAt(a,b,c){
  // cùng quy ước với bản Flutter: trục y hướng xuống, góc dương = rẽ phải
  const a1=Math.atan2(b.y-a.y,b.x-a.x),a2=Math.atan2(c.y-b.y,c.x-b.x);
  let d=(a2-a1)*180/Math.PI;while(d<=-180)d+=360;while(d>180)d-=360;
  if(d>25&&d<155) return "right"; if(d<-25&&d>-155) return "left"; if(Math.abs(d)>=155) return "back"; return null;
}
function buildSteps(route,place,dept,facing,fsrc){
  const ids=route.ids,steps=[],total=route.edges.reduce((s,e)=>s+meters(e.len),0);
  steps.push({ic:"go",t:`Bạn đang ở <b>${N[ids[0]].name}</b>`});
  if(route.edges.length&&facing!=null){
    const a=N[ids[0]],b=N[ids[1]],tgt=b.type==="jct"?b.lm:b.name;
    let d=Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI-facing;while(d<=-180)d+=360;while(d>180)d-=360;
    if(Math.abs(d)>145) steps.push({ic:"back",t:`<b>${fsrc==="compass"?"Quay người ra phía sau":"Quay lưng lại tấm biển QR"}</b>, hướng về ${tgt}`});
    else if(d>=35) steps.push({ic:"right",t:`<b>Quay người sang phải</b>, hướng về ${tgt}`});
    else if(d<=-35) steps.push({ic:"left",t:`<b>Quay người sang trái</b>, hướng về ${tgt}`});
    else steps.push({ic:"straight",t:`<b>Đi thẳng về phía trước</b>, hướng về ${tgt}`});
  }
  if(ids.length===1){ steps.push({ic:"end",t:`Bạn đang đứng ngay <b>${N[ids[0]].name}</b>`}); }
  const kind=e=>e.indoor?"in":e.cov?"cov":"out";
  let acc=0;
  for(let k=0;k<route.edges.length;k++){
    const e=route.edges[k];acc+=meters(e.len);
    const lead=kind(e)==="in"?`Đi xuyên qua ${e.indoor} khoảng <b>${fmtM(acc)}</b>`:
               kind(e)==="cov"?`Đi theo hành lang có mái che khoảng <b>${fmtM(acc)}</b>`:`Đi thẳng khoảng <b>${fmtM(acc)}</b>`;
    const at=N[ids[k+1]];
    if(k===route.edges.length-1){ steps.push({ic:"end",t:`${lead} là tới <b>${at.name}</b>`}); break; }
    const t=turnAt(N[ids[k]],at,N[ids[k+2]]);
    if(t){
      const word=t==="right"?"rẽ phải":t==="left"?"rẽ trái":"quay ngược lại";
      steps.push({ic:t,t:`${lead}, rồi <b>${word}</b> ở ${at.lm}`});acc=0;
    }else if(kind(route.edges[k+1])!==kind(e)){
      steps.push({ic:"straight",t:`${lead} tới ${at.type==="jct"?at.lm:"<b>"+at.name+"</b>"}`});acc=0;
    }
  }
  if(dept){
    if(dept.f===1) steps.push({ic:"floor",t:`<b>${dept.n}</b> ở ngay <b>Tầng 1</b>, vào cửa là tới`});
    else if(dept.f) steps.push({ic:"floor",t:`Vào tòa, lên <b>Tầng ${dept.f}</b> bằng thang máy hoặc cầu thang bộ để tới <b>${dept.n}</b>`});
    else steps.push({ic:"floor",t:`Vào tòa, hỏi quầy hướng dẫn để tới <b>${dept.n}</b>`});
  }
  return {steps,total};
}

{const root=N.cong_chinh?"cong_chinh":Object.keys(N)[0];
 if(root){const r0=dijkstra(root);Object.keys(N).forEach(k=>{if(!isFinite(r0.dist[k]))PROBLEMS.push(`Điểm "${k}" chưa có đường nối tới ${N[root].name}.`);});}
 if(PROBLEMS.length) console.warn("Lỗi dữ liệu map_data.json:\n"+PROBLEMS.join("\n"));}

// ================= TÌM KIẾM =================
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[–\-_,&()]/g," ").replace(/\s+/g," ").trim();
const INDEX=[];
PLACES.forEach(p=>{
  INDEX.push({p,d:null,t:p.name,s:p.depts.length?`${p.depts.length} khoa, phòng`:(p.doors[0]&&N[p.doors[0]].type==="gate"?"Cổng":"Điểm đến"),h:norm(p.name+" "+(p.a||""))});
  p.depts.forEach(d=>INDEX.push({p,d,t:d.n,s:(d.f?`Tầng ${d.f} · `:"")+p.name,h:norm(d.n+" "+p.name+" "+(d.a||""))}));
});
function search(q){
  const nq=norm(q); if(!nq) return [];
  const toks=nq.split(" ");

  sSum.textContent=route.edges.length?`Khoảng ${mins} phút đi bộ · ${fmtM(total)}`:"Bạn đang ở ngay đây";

  sBody.appendChild(ol);

  drawRoute(route.ids);

  destLbl.el.textContent=dept?`${place.name}${dept.f?" · Tầng "+dept.f:""}`:place.name;

function onOrient(e){
  let hd=null;
  if(typeof e.webkitCompassHeading==="number"&&e.webkitCompassHeading>=0){hd=e.webkitCompassHeading;
    if(e.webkitCompassAccuracy>35&&!compass.warned){compass.warned=1;toast("La bàn đang kém chính xác. Hãy cầm máy nằm ngang và xoay cổ tay theo hình số 8 vài lần.",6000);}}
  else if(e.absolute&&e.alpha!=null) hd=360-e.alpha;
  if(hd==null) return;
  hd=(hd+((screen.orientation&&screen.orientation.angle)||0)+360)%360;
  compass.got=true;
  const mf=((hd-MAP_UP_BEARING)%360+360)%360;
  if(compass.heading==null) compass.heading=mf;
  else{let d=mf-compass.heading;while(d>180)d-=360;while(d<-180)d+=360;compass.heading=(compass.heading+d*.2+360)%360;}
  facing=compass.heading;facingSrc="compass";updateBeam();
  const now=performance.now();
  if(current&&now-compass.lastT>1200){let d=Math.abs(facing-(compass.lastUsed??facing+99));if(d>180)d=360-d;
    if(d>25){compass.lastUsed=facing;compass.lastT=now;showRoute(current.place,current.dept,true);}}
}

  compass.on=compass.follow=true;compass.got=false;compass.heading=null;compass.lastUsed=null;vC.setAttribute("aria-pressed","true");

  {id:"cong_sau_bac",lat:18.68160691,lng:105.7017953},{id:"cua_nhiet_doi",lat:18.68212816,lng:105.70206408},

function gpsFitOf(anchors,nodeOf){

  const en=(lat,lng)=>[(lng-lng0)*k*R*Math.cos(lat0*k),(lat-lat0)*k*R];

  const Z=P.map(o=>en(+o.a.lat,+o.a.lng)),W=P.map(o=>[o.n.x,-o.n.y]);
  const mz=[0,0],mw=[0,0];Z.forEach(z=>{mz[0]+=z[0]/P.length;mz[1]+=z[1]/P.length;});W.forEach(w=>{mw[0]+=w[0]/P.length;mw[1]+=w[1]/P.length;});

  const res=P.map((o,i)=>{const p=toPx0(+o.a.lat,+o.a.lng);return Math.hypot(p[0]-o.n.x,p[1]-o.n.y)/pxPerM;});

  return {toPx,pxPerM,mpp:1/pxPerM,bearing:((Math.atan2(up[0],up[1])*180/Math.PI)+360)%360,res,center:[lat0,lng0]};
}

function homeSearch(query){
  const hq=$("hq"),R=$("hRes");if(!hq||!R)return;const v=hq.value.trim();$("hqx").hidden=!v;

  const B=searchF(q2).map(o=>({k:"f",x:o.x,r:o.r}));
  const all=[...A,...B].sort((a,b)=>a.r-b.r||(a.k==="f"?1:0)-(b.k==="f"?1:0)).slice(0,30);
  R.hidden=false;R.innerHTML="";
  if(!all.length){R.innerHTML=`<div class="empty">Không tìm thấy “${escH(v)}”. Thử gõ ngắn hơn, ví dụ “sản”, “nhi”, “xét nghiệm”, hoặc hỏi quầy hướng dẫn gần nhất.</div>`;return;}
  const hd=document.createElement("div");hd.className="hd";hd.innerHTML=`<span>${all.length>=30?"30+":all.length} nơi phù hợp</span><span>Bấm để xem đường đi</span>`;R.appendChild(hd);

      b.onclick=()=>{setScreen("map");choose(o.it);};}
    else{b.innerHTML=`<i style="background:#fff1e6;color:#c2410c">${ico({wc:"wc",pharm:"pharm",er:"er",money:"money",desk:"desk",lab:"lab",scan:"scan",baby:"baby",steth:"steth"}[o.x.c]||"pin")}</i><span class="t"><b>${escH(o.x.n)}</b><small><span class="tagF">Nhà F</span>Tầng ${o.x.f} · mở bản đồ nhà F</small></span><span class="chev" style="color:var(--h-mute)">${IC.chev}</span>`;

function openSearch(){if(screen!=="home")setScreen("home");const hq=$("hq");if(hq){hq.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>hq.focus(),80);}}
function runQuery(label,query){if(screen!=="home")setScreen("home");const hq=$("hq");hq.value=label;homeSearch(query);
  const R=$("hRes");if(!R.hidden)R.scrollIntoView({block:"start",behavior:"smooth"});}
function doAction(s){const a=s.action||"search";
  if(a==="qr")openScan();else if(a==="search")openSearch();else if(a==="history")openPage("history");else if(a==="notices")openPage("notices");else if(a==="info")openPage("info");

function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;try{const r=new R();r.lang="vi-VN";r.interimResults=false;
  r.onresult=e=>{const t=e.results[0][0].transcript;if(screen!=="home")setScreen("home");$("hq").value=t;homeSearch();};r.onerror=()=>toast("Không nghe rõ. Bạn hãy thử lại hoặc gõ tên khoa phòng.");r.start();toast("Đang nghe… hãy nói tên khoa hoặc phòng.",3000);}catch(e){}}

  if(kind==="notices"){const list=UI.notices||[];

    c.innerHTML=row("phone","Đường dây nóng",I.hotline,tel)+row("phone","Cấp cứu",I.emergency,I.emergency?`<a href="tel:${escH(String(I.emergency).replace(/[^\d+]/g,""))}">${escH(I.emergency)}</a>`:"")+row("pin","Địa chỉ",I.address)+row("clock","Giờ làm việc",I.hours)+row("link","Trang web",I.website,I.website?`<a href="${escH(I.website)}" target="_blank" rel="noopener">${escH(I.website.replace(/^https?:\/\//,""))}</a>`:"");
    if(!c.innerHTML)c.innerHTML=`<div class="pempty">Phòng CNTT chưa nhập thông tin liên hệ.</div>`;B.appendChild(c);
    if(I.note){const d=document.createElement("div");d.className="pcard";d.innerHTML=`<p>${escH(I.note)}</p>`;B.appendChild(d);}
    const d2=document.createElement("div");d2.className="pcard";d2.innerHTML=`<div class="prow"><i>${ico("pin")}</i><span><small>Vị trí của bạn trên bản đồ</small>${escH(startName())}</span><button class="pbtn" id="iScan">Quét QR</button></div>`;B.appendChild(d2);$("iScan").onclick=openScan;}
  if(kind==="history"){const h=LSx.get("recent",[]).filter(x=>x.fto||PLACE_BY_ID[x.p]);
    if(!h.length){B.innerHTML=`<div class="pempty">Bạn chưa tìm nơi nào trên máy này.</div>`;return;}
    const c=document.createElement("div");c.className="pcard";

      const p=PLACE_BY_ID[x.p],d=x.d?p.depts.find(y=>y.n===x.d):null;const r=document.createElement("div");r.className="prow";r.style.cursor="pointer";
      r.innerHTML=`<i>${ico("history")}</i><span>${escH(d?d.n:p.name)}<small>${escH(d?((d.f?"Tầng "+d.f+" · ":"")+p.name):(p.note||""))} · ${new Date(x.t).toLocaleDateString("vi-VN")}</small></span>${IC.chev}`;
      r.onclick=()=>{setScreen("map");q.value=d?d.n:p.name;showRoute(p,d);};c.appendChild(r);});
    B.appendChild(c);const clr=document.createElement("button");clr.className="pbtn";clr.style.marginTop="12px";clr.textContent="Xóa lịch sử";clr.onclick=()=>{LSx.set("recent",[]);openPage("history");};B.appendChild(clr);}
  if(kind==="all"){PLACES.filter(p=>p.depts.length||p.a).forEach(p=>{const gp=document.createElement("div");gp.className="dirgrp";gp.textContent=p.name;B.appendChild(gp);const wrap=document.createElement("div");wrap.className="dirlist";
      const items=p.depts.length?p.depts:[null];const seen=new Set();
      items.forEach(d=>{const k=d?d.n:p.name;if(seen.has(k))return;seen.add(k);const b=document.createElement("button");b.innerHTML=`${escH(d?d.n:p.name)}<small>${d&&d.f?"Tầng "+d.f:escH(p.note||"")}</small>`;
        b.onclick=()=>{setScreen("map");q.value=d?d.n:p.name;showRoute(p,d);};wrap.appendChild(b);});B.appendChild(wrap);});}
}

tabbar.innerHTML=`<div class="in">
  <button data-s="home">${IC.home}<span>Trang chủ</span></button>
  <button data-s="map">${IC.map}<span>Bản đồ</span></button>

tabbar.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.a==="scan")openScan();else if(b.dataset.s==="home")setScreen("home");else if(b.dataset.s==="map")openPage("maps");else openPage(b.dataset.s);});
$("mapHome").onclick=()=>setScreen("home");

// ---- quét mã QR ngay trong trang
let scanStream=null,scanTimer=null,detector=null,detTried=false,scanBusy=false;
// Đọc mã QR: Android/Chrome dùng bộ đọc có sẵn của máy (rất nhanh); iPhone dùng jsQR, chỉ đọc vùng khung ngắm giữa màn hình cho nhanh.
async function getDetector(){if(detTried)return detector;detTried=true;
  try{if("BarcodeDetector" in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code"))detector=new BarcodeDetector({formats:["qr_code"]});}}catch(e){detector=null;}return detector;}
let jsqrP=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve(true);if(jsqrP)return jsqrP;
  jsqrP=new Promise(res=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";s.onload=()=>res(true);s.onerror=()=>{jsqrP=null;res(false);};document.head.appendChild(s);});return jsqrP;}
// tải sẵn bộ đọc ngay khi mở trang, để bấm Quét QR là đọc được luôn
setTimeout(async()=>{if(!(await getDetector()))loadJsQR();},1500);
const dc=document.createElement("canvas"),dx=dc.getContext("2d",{willReadFrequently:true});
let scanTick=0;
function jsqrRegion(src,w,h,sx,sy,sw,sh,out){dc.width=out;dc.height=out;dx.imageSmoothingEnabled=true;dx.drawImage(src,sx,sy,sw,sh,0,0,out,out);
  const d=dx.getImageData(0,0,out,out);const r=jsQR(d.data,out,out,{inversionAttempts:"dontInvert"});return r?r.data:null;}
async function decodeFrame(src,w,h,full){
  if(detector){try{const r=await detector.detect(src);if(r&&r[0])return r[0].rawValue;}catch(e){}if(!window.jsQR)return null;}
  if(!window.jsQR)return null;
  const m=Math.min(w,h);
  if(full){ // ảnh chọn từ máy: thử cả ảnh rồi vùng giữa
    const s=Math.min(1,1000/Math.max(w,h));dc.width=Math.round(w*s);dc.height=Math.round(h*s);dx.drawImage(src,0,0,dc.width,dc.height);
    const d=dx.getImageData(0,0,dc.width,dc.height);const r=jsQR(d.data,dc.width,dc.height);if(r)return r.data;
    return jsqrRegion(src,w,h,(w-m*.7)/2,(h-m*.7)/2,m*.7,m*.7,600);}
  // camera: luân phiên vùng khung ngắm (70%) và vùng hẹp hơn (45%) để mã ở xa vẫn đủ nét
  scanTick++;const k=scanTick%3===2?.45:.72,c=m*k;
  return jsqrRegion(src,w,h,(w-c)/2,(h-c)/2,c,c,k<.5?420:520);}
function scanMsg(t){$("scanMsg").innerHTML=t;}
async function openScan(){
  scanV.hidden=false;scanMsg("Đưa mã QR vào giữa khung. Giữ máy cách mã khoảng 20–40 cm.");
  const v=$("scanVideo");
  const camP=navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}}):Promise.reject(new Error("no cam"));
  const [,stream]=await Promise.all([getDetector().then(d=>d?null:loadJsQR()),camP.catch(e=>null)]);
  if(scanV.hidden){if(stream)stream.getTracks().forEach(t=>t.stop());return;}
  if(!stream){scanMsg("Không mở được camera. Hãy cho phép trang dùng camera, hoặc bấm <b>Ảnh</b> để chọn ảnh chụp mã QR, hoặc <b>Chọn thủ công</b>.");return;}
  scanStream=stream;v.srcObject=stream;
  try{const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};const adv=[];
    if(cap.focusMode&&cap.focusMode.includes("continuous"))adv.push({focusMode:"continuous"});
    if(cap.zoom&&cap.zoom.max>=1.5)adv.push({zoom:Math.min(1.5,cap.zoom.max)}); // phóng nhẹ cho mã to hơn
    if(adv.length)tr.applyConstraints({advanced:adv}).catch(()=>{});}catch(e){}
  try{await v.play();}catch(e){}
  if(!detector&&!window.jsQR){scanMsg("Không tải được bộ đọc mã. Kiểm tra mạng rồi thử lại, hoặc dùng ứng dụng Camera của máy để quét.");}
  const loop=async()=>{if(!scanStream)return;
    if(v.readyState>=2&&!scanBusy){scanBusy=true;let t=null;try{t=await decodeFrame(v,v.videoWidth,v.videoHeight);}catch(e){}scanBusy=false;if(t){onCode(t);return;}}
    scanTimer=setTimeout(loop,detector?90:60);};
  loop();
}
// sau khi biết vị trí: luôn chuyển sang bản đồ. Đã chọn nơi đến thì vẽ đường luôn, chưa chọn thì mời gõ nơi cần đến.
function afterLocate(to){
  const typed=$("hq")?$("hq").value.trim():"";
  setScreen("map");
  if(to){const p=PLACE_BY_ID[to];if(p){q.value=p.name;showRoute(p,null);return;}}
  if(current){toast("Bạn đang ở "+N[startId].name+". Đường đi đã vẽ lại từ đây.",4000);return;}
  if(typed){q.value=typed;renderResults(search(typed),typed);toast("Bạn đang ở "+N[startId].name+". Chọn nơi cần đến trong danh sách.",4000);return;}
  toast("Bạn đang ở "+N[startId].name+". Gõ tên khoa, phòng cần đến ở ô tìm kiếm.",4500);
}
function closeScan(){scanV.hidden=true;clearTimeout(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
function onCode(text){
  let start=null,h=null,to=null;
  try{const u=new URL(text,location.href);start=u.searchParams.get("start");h=u.searchParams.get("h");to=u.searchParams.get("to");
    if(!start&&u.hash){const hs=decodeURIComponent(u.hash.slice(1));const i=hs.indexOf("?");if(i>=0){const sp=new URLSearchParams(hs.slice(i+1));start=sp.get("start");h=sp.get("h");to=sp.get("to");}}}catch(e){}
  try{const u=new URL(text,location.href);if(/\/nhaf\/?$/.test(u.pathname)&&u.searchParams.get("start")){closeScan();location.href="nhaf/?start="+encodeURIComponent(u.searchParams.get("start"));return;}}catch(e){}
  if(start&&!N[start]&&OLD_IDS[start])start=OLD_IDS[start];
  if(!start||!N[start]||N[start].type==="jct"){scanMsg("Mã QR này không phải mã vị trí của bệnh viện. Hãy quét mã dán ở cổng, cửa tòa nhà hoặc sảnh thang máy.");
    if(scanStream)scanTimer=setTimeout(async function again(){const v=$("scanVideo");const t=await decodeFrame(v,v.videoWidth,v.videoHeight);if(t&&t!==text){onCode(t);return;}if(scanStream)scanTimer=setTimeout(again,260);},1200);return;}
  closeScan();located=true;const hv=parseFloat(h);setStart(start,isFinite(hv)?((hv%360)+360)%360:null);
  try{fetch(LOG_URL+"?location="+encodeURIComponent(N[start].name)+"&id="+encodeURIComponent(start)+"&src=web",{mode:"no-cors",keepalive:true}).catch(()=>{});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  afterLocate(to);
}
$("scanClose").onclick=closeScan;
$("scanManual").onclick=()=>{closeScan();setScreen("map");startSel.focus();toast("Chọn vị trí của bạn ở ô “Bạn đang ở” phía trên.",4000);};
$("scanFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;await getDetector();await loadJsQR();
  const img=new Image();img.onload=async()=>{const t=await decodeFrame(img,img.naturalWidth,img.naturalHeight,true);URL.revokeObjectURL(img.src);if(t)onCode(t);else scanMsg("Không đọc được mã QR trong ảnh này. Hãy chụp gần hơn và rõ nét.");};
  img.src=URL.createObjectURL(f);e.target.value="";};
$("scanAlbum").onclick=()=>$("scanFile").click();

// ================= KHỞI ĐỘNG =================
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(PREVIEW){const b=document.createElement("div");b.className="previewBadge";b.textContent="Bản xem thử từ trang quản trị, chưa lưu";document.getElementById("app").appendChild(b);}
(function boot(){
  const {start,to,h}=readParams();let sid="cong_chinh";
  if(start){
    if(N[start]&&N[start].type!=="jct"){sid=start;located=true;}
    else if(start in OLD_IDS&&OLD_IDS[start]===null) toast("Tòa C đã ngừng sử dụng. Vị trí xuất phát được đặt tại Cổng chính, bạn có thể đổi ở ô phía trên.",6000);
    else if(OLD_IDS[start]||N[start]) toast("Mã QR này không gắn với cửa hay cổng nào. Vui lòng chọn vị trí của bạn ở ô phía trên.",6000);
    else toast("Không nhận ra mã QR. Vị trí xuất phát đang là Cổng chính, bạn có thể đổi ở ô phía trên.",6000);
    // ghi nhận lượt quét (mỗi phiên một lần)
    try{const k="logged_"+sid;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,"1");
      fetch(LOG_URL+"?location="+encodeURIComponent(N[sid].name)+"&id="+encodeURIComponent(sid),{mode:"no-cors",keepalive:true}).catch(()=>{});}}catch(e){}
  }
  setStart(sid,sid===start?h:null);
  if(to){const p=PLACE_BY_ID[to]||PLACES.find(p=>p.doors.includes(to));if(p){q.value=p.name;showRoute(p,null);}}
  route();
  setScreen((to||located||location.hash==="#qr"||location.hash==="#toado")?"map":"home");
  if(located&&!to)toast("Bạn đang ở "+N[startId].name+". Gõ tên khoa, phòng cần đến ở ô tìm kiếm.",5000);
})();

const v=new THREE.Vector3();let last=performance.now(),flow=0;
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(anim){let k=reduce?1:Math.min(1,(now-anim.t0)/900);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(anim.ft,anim.target,k);camera.position.lerpVectors(anim.fp,anim.pos,k);if(k>=1)anim=null;}
  if(chevrons.length){flow=(flow+dt*(reduce?0:6))%5;chevrons.forEach((c,i)=>{const r=pointAt((i*5+flow)%routeLen);c.position.x=r.p.x;c.position.z=r.p.z;c.rotation.y=r.ang;});}
  const pulse=1+.25*Math.sin(now/300);[startPin,destPin].forEach(p=>{if(p.visible)p.children[2].scale.setScalar(reduce?1:pulse);});
  if(compass.on&&compass.follow&&!anim){
    const d=facingVec(facing),t=controls.target,off=camera.position.clone().sub(t),hd=Math.hypot(off.x,off.z);
    const want=new THREE.Vector3(t.x-d.x*hd,camera.position.y,t.z-d.y*hd);camera.position.lerp(want,.12);
  }
  gpsTick();controls.update();renderer.render(scene,camera);
  const W=app.clientWidth,H=app.clientHeight,dist=camera.position.distanceTo(controls.target);
  labelEls.forEach(L=>{if(L.hidden){L.el.style.display="none";return;}v.copy(L.pos).project(camera);
    const off=v.z>1||v.x<-1.1||v.x>1.1||v.y<-1.1||v.y>1.1,far=L.el.classList.contains("small")&&dist>240;
    L.el.style.display=off||far?"none":"";if(!off){L.el.style.left=(v.x*.5+.5)*W+"px";L.el.style.top=(-v.y*.5+.5)*H+"px";}});
}
requestAnimationFrame(loop);

// dùng cho kiểm thử
window.__nav={N,E,PLACES,dijkstra,pathTo,buildSteps,search,gps,GPS_FIT};
})();
